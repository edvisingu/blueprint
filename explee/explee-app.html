<title>Explee — AI Prospecting</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
:root {
  --bg: #0b0d12;
  --bg-2: #11141c;
  --panel: #151925;
  --panel-2: #1b2030;
  --border: #262c3d;
  --text: #e7eaf2;
  --muted: #9aa3b8;
  --faint: #6b7488;
  --brand: #6c5ce7;
  --brand-2: #8f7bff;
  --brand-soft: rgba(108, 92, 231, 0.14);
  --green: #2ecc71;
  --amber: #f5a623;
  --red: #ff5b6a;
  --radius: 14px;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: radial-gradient(1200px 600px at 80% -10%, rgba(108, 92, 231, 0.12), transparent 60%),
              radial-gradient(900px 500px at -10% 10%, rgba(143, 123, 255, 0.08), transparent 55%),
              var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
::selection { background: var(--brand-soft); }

/* ---------- Top bar ---------- */
.topbar {
  height: 62px;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(11, 13, 18, 0.7);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 40;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 19px;
  letter-spacing: -0.02em;
}
.logo .mark {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  display: grid; place-items: center;
  font-size: 15px; color: white;
  box-shadow: 0 6px 18px rgba(108, 92, 231, 0.5);
}
.logo .beta {
  font-size: 10px; font-weight: 700; color: var(--brand-2);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 2px 8px; margin-left: 2px; letter-spacing: 0.05em;
}
.topnav { display: flex; gap: 4px; margin-left: 14px; }
.topnav button {
  background: none; border: none; color: var(--muted);
  padding: 8px 14px; border-radius: 9px; font-size: 14px; font-weight: 500;
}
.topnav button:hover { color: var(--text); background: var(--panel); }
.topnav button.active { color: var(--text); background: var(--panel-2); }
.spacer { flex: 1; }
.credits {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--muted);
  border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px;
}
.credits b { color: var(--text); }
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, #4a4f6a, #2b2f45);
  display: grid; place-items: center; font-size: 13px; font-weight: 700;
}

/* ---------- Layout ---------- */
.view { display: none; }
.view.active { display: block; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }

/* ---------- Search hero ---------- */
.hero { text-align: center; padding: 46px 0 26px; }
.hero h1 {
  font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15;
}
.hero h1 .grad {
  background: linear-gradient(120deg, var(--brand-2), #c9a6ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero p { color: var(--muted); margin-top: 12px; font-size: 15px; }

.searchbar {
  margin: 26px auto 0; max-width: 760px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 16px; padding: 8px 8px 8px 18px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: var(--shadow);
}
.searchbar:focus-within { border-color: var(--brand); }
.searchbar .si { color: var(--faint); font-size: 18px; }
.searchbar input {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text); font-size: 15.5px; padding: 12px 0;
}
.searchbar input::placeholder { color: var(--faint); }
.btn {
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: white; border: none; border-radius: 11px;
  padding: 12px 20px; font-weight: 600; font-size: 14px;
  display: inline-flex; align-items: center; gap: 8px;
  transition: transform 0.08s ease, box-shadow 0.2s ease;
}
.btn:hover { box-shadow: 0 8px 22px rgba(108, 92, 231, 0.45); }
.btn:active { transform: translateY(1px); }
.btn.ghost {
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--border); box-shadow: none;
}
.btn.ghost:hover { border-color: var(--brand); }
.btn.small { padding: 8px 14px; font-size: 13px; border-radius: 9px; }
.btn[disabled] { opacity: 0.5; pointer-events: none; }

.examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
.chip {
  font-size: 13px; color: var(--muted);
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 20px; padding: 7px 14px; transition: 0.15s;
}
.chip:hover { color: var(--text); border-color: var(--brand); }

.stats-row { display: flex; gap: 26px; justify-content: center; margin-top: 34px; flex-wrap: wrap; }
.stat { text-align: center; }
.stat b { display: block; font-size: 22px; font-weight: 800; }
.stat span { font-size: 12px; color: var(--faint); letter-spacing: 0.04em; text-transform: uppercase; }

/* ---------- Results ---------- */
.results-layout { display: grid; grid-template-columns: 244px 1fr; gap: 22px; align-items: start; margin-top: 8px; }
.filters {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; position: sticky; top: 84px;
}
.filters h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); margin-bottom: 12px; }
.fgroup { margin-bottom: 20px; }
.fgroup > label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 7px; font-weight: 600; }
.fopt { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13.5px; color: var(--muted); cursor: pointer; }
.fopt:hover { color: var(--text); }
.fopt input { accent-color: var(--brand); width: 15px; height: 15px; }
.fselect, .finput {
  width: 100%; background: var(--bg-2); border: 1px solid var(--border);
  color: var(--text); border-radius: 9px; padding: 9px 10px; font-size: 13.5px; outline: none;
}
.fselect:focus, .finput:focus { border-color: var(--brand); }
.filters .clear { background: none; border: none; color: var(--brand-2); font-size: 12.5px; padding: 0; }

.inline-search {
  display: flex; align-items: center; gap: 10px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 6px 6px 6px 14px; margin-bottom: 18px;
}
.inline-search:focus-within { border-color: var(--brand); }
.inline-search .si { color: var(--faint); font-size: 15px; }
.inline-search input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 14.5px; padding: 9px 0; }
.inline-search input::placeholder { color: var(--faint); }

.results-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; flex-wrap: wrap; gap: 12px;
}
.results-head .rq { font-size: 14px; color: var(--muted); }
.results-head .rq b { color: var(--text); }
.results-head .actions { display: flex; gap: 8px; }

.parsed { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
.token {
  font-size: 12px; padding: 5px 10px; border-radius: 20px;
  background: var(--brand-soft); color: var(--brand-2); border: 1px solid rgba(108, 92, 231, 0.35);
  display: inline-flex; align-items: center; gap: 6px;
}
.token .k { color: var(--faint); text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; }

.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; margin-bottom: 12px;
  transition: border-color 0.15s, transform 0.1s;
  display: grid; grid-template-columns: 46px 1fr auto; gap: 16px; align-items: start;
}
.card:hover { border-color: var(--brand); }
.card .fav {
  width: 46px; height: 46px; border-radius: 11px;
  display: grid; place-items: center; font-weight: 800; font-size: 18px; color: white;
}
.card .cname { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card .cname h4 { font-size: 16px; font-weight: 700; }
.card .cname .dom { font-size: 12.5px; color: var(--faint); }
.card .cdesc { color: var(--muted); font-size: 13.5px; margin-top: 6px; line-height: 1.5; }
.card .meta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 11px; font-size: 12.5px; color: var(--faint); }
.card .meta span { display: inline-flex; align-items: center; gap: 5px; }
.card .right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.match {
  font-size: 12px; font-weight: 700; color: var(--green);
  border: 1px solid rgba(46, 204, 113, 0.3); background: rgba(46, 204, 113, 0.08);
  border-radius: 20px; padding: 4px 10px;
}
.match.mid { color: var(--amber); border-color: rgba(245, 166, 35, 0.3); background: rgba(245, 166, 35, 0.08); }
.card .contacts-badge { font-size: 12px; color: var(--muted); }
.tagrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.tag { font-size: 11px; color: var(--faint); background: var(--panel-2); border-radius: 6px; padding: 3px 8px; }

.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty .em { font-size: 40px; margin-bottom: 10px; }

/* ---------- Modal (company detail) ---------- */
.modal-bg {
  position: fixed; inset: 0; background: rgba(6, 8, 12, 0.7); backdrop-filter: blur(4px);
  display: none; align-items: flex-start; justify-content: center; z-index: 60; padding: 40px 20px; overflow-y: auto;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 18px; width: 100%; max-width: 720px; box-shadow: var(--shadow);
}
.modal-head { display: flex; gap: 16px; align-items: flex-start; padding: 22px 24px; border-bottom: 1px solid var(--border); }
.modal-head .fav { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 20px; color: white; }
.modal-head h2 { font-size: 20px; font-weight: 800; }
.modal-head .sub { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
.modal-head .x { margin-left: auto; background: none; border: none; color: var(--faint); font-size: 24px; line-height: 1; }
.modal-head .x:hover { color: var(--text); }
.modal-body { padding: 22px 24px; }
.modal-body .sec-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); margin: 4px 0 12px; }
.kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 22px; margin-bottom: 22px; }
.kv div .k { font-size: 11.5px; color: var(--faint); }
.kv div .v { font-size: 14px; color: var(--text); margin-top: 2px; }

.contact {
  display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border);
}
.contact .ci { width: 38px; height: 38px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.contact .cn { font-size: 14px; font-weight: 600; }
.contact .ct { font-size: 12.5px; color: var(--muted); }
.contact .em { font-size: 12.5px; color: var(--brand-2); }
.vbadge { font-size: 11px; padding: 3px 8px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; }
.vbadge.ok { color: var(--green); background: rgba(46, 204, 113, 0.1); }
.vbadge.no { color: var(--amber); background: rgba(245, 166, 35, 0.1); }
.contact .cright { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.modal-foot { display: flex; gap: 10px; padding: 18px 24px; border-top: 1px solid var(--border); flex-wrap: wrap; }

/* AI message box */
.aibox { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 6px; }
.aibox textarea {
  width: 100%; min-height: 120px; background: var(--bg-2); border: 1px solid var(--border);
  color: var(--text); border-radius: 9px; padding: 12px; font-family: var(--font); font-size: 13.5px; resize: vertical; line-height: 1.55;
}
.aibox .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.aibox .hint { font-size: 12px; color: var(--faint); }

/* ---------- Lists view ---------- */
.list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
.list-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.table th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); padding: 13px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
.table td { padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 13.5px; color: var(--muted); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tr:hover td { background: var(--panel-2); }
.table .co { color: var(--text); font-weight: 600; }
.table .em { color: var(--brand-2); }
.remove { background: none; border: none; color: var(--faint); font-size: 16px; }
.remove:hover { color: var(--red); }

.saved-flag { color: var(--green); }

/* ---------- Toast ---------- */
.toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  padding: 11px 18px; border-radius: 10px; font-size: 13.5px; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 8px; animation: pop 0.2s ease;
}
.toast .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* loading */
.loading { text-align: center; padding: 70px 0; color: var(--muted); }
.spinner {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid var(--border); border-top-color: var(--brand);
  margin: 0 auto 16px; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.count-pill { font-size: 12px; background: var(--brand-soft); color: var(--brand-2); border-radius: 20px; padding: 3px 10px; font-weight: 600; }

@media (max-width: 860px) {
  .results-layout { grid-template-columns: 1fr; }
  .filters { position: static; }
  .card { grid-template-columns: 40px 1fr; }
  .card .right { grid-column: 1 / -1; flex-direction: row; align-items: center; }
  .kv { grid-template-columns: 1fr; }
}

</style>

<script>
/* Explee clone — application logic
 * - Natural-language ICP parsing
 * - Semantic-style scoring / search over the built-in prospect DB
 * - Filters, lead lists (localStorage), CSV export, AI outreach drafting
 */
(function () {
  "use strict";

  const DB = window.EXPLEE_DB;
  const COMPANIES = DB.companies;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

  // ------------------------------------------------------------------ state
  const state = {
    query: "",
    parsed: null,
    results: [],
    filters: { industries: new Set(), size: "any", country: "", verifiedOnly: false, sort: "match" },
    list: loadList(),
    lastCompanyId: null,
  };

  const FAV_COLORS = ["#6c5ce7", "#00b894", "#0984e3", "#e17055", "#e84393", "#fdcb6e", "#00cec9", "#a29bfe"];
  const favColor = (name) => FAV_COLORS[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % FAV_COLORS.length];
  const initials = (n) => n.split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();

  // ------------------------------------------------------------------ NL parsing
  const COUNTRY_ALIASES = {
    "uk": "United Kingdom", "united kingdom": "United Kingdom", "britain": "United Kingdom", "england": "United Kingdom",
    "us": "United States", "usa": "United States", "united states": "United States", "america": "United States",
    "germany": "Germany", "france": "France", "canada": "Canada", "netherlands": "Netherlands",
    "australia": "Australia", "india": "India", "ireland": "Ireland", "sweden": "Sweden",
    "spain": "Spain", "singapore": "Singapore", "nigeria": "Nigeria", "africa": "Nigeria",
    "europe": "__EUROPE__",
  };
  const EUROPE = ["United Kingdom", "Germany", "France", "Netherlands", "Ireland", "Sweden", "Spain"];

  const INDUSTRY_KEYWORDS = {
    "Fintech": ["fintech", "finance", "financial", "payments", "payment", "banking", "lending", "payroll", "billing"],
    "SaaS": ["saas", "software", "b2b software", "platform", "devtools", "developer tools", "productivity"],
    "E-commerce": ["ecommerce", "e-commerce", "commerce", "retail", "dtc", "shopify", "online store"],
    "HealthTech": ["health", "healthtech", "healthcare", "medical", "clinical", "telehealth", "medtech"],
    "AI / ML": ["ai", "artificial intelligence", "machine learning", "ml", "llm", "computer vision", "data"],
    "Marketing": ["marketing", "adtech", "ads", "advertising", "social media", "content", "demand gen"],
    "EdTech": ["edtech", "education", "learning", "training", "lms", "e-learning"],
    "Logistics": ["logistics", "supply chain", "delivery", "warehouse", "fulfillment", "shipping"],
    "Cybersecurity": ["cybersecurity", "security", "infosec", "cyber", "fraud", "identity"],
    "CleanTech": ["cleantech", "climate", "green", "solar", "energy", "carbon", "esg", "agtech", "sustainability"],
  };

  function parseQuery(q) {
    const text = " " + q.toLowerCase() + " ";
    const parsed = { raw: q, industries: [], country: null, sizeMin: null, sizeMax: null, keywords: [] };

    // industries
    for (const [ind, kws] of Object.entries(INDUSTRY_KEYWORDS)) {
      if (kws.some((k) => text.includes(" " + k) || text.includes(k + " "))) parsed.industries.push(ind);
    }

    // country
    for (const [alias, canonical] of Object.entries(COUNTRY_ALIASES)) {
      if (text.includes(" " + alias + " ") || text.includes(" in " + alias) || text.endsWith(alias + " ")) {
        parsed.country = canonical; break;
      }
    }

    // size — "under 30", "under 30 employees", "less than 50", "over 100", "10-50", "50+"
    let m;
    if ((m = text.match(/under (\d+)/)) || (m = text.match(/less than (\d+)/)) || (m = text.match(/fewer than (\d+)/))) {
      parsed.sizeMax = +m[1];
    }
    if ((m = text.match(/over (\d+)/)) || (m = text.match(/more than (\d+)/)) || (m = text.match(/(\d+)\+/))) {
      parsed.sizeMin = +m[1];
    }
    if ((m = text.match(/(\d+)\s*[-–to]+\s*(\d+)/))) { parsed.sizeMin = +m[1]; parsed.sizeMax = +m[2]; }
    if (/\bstartups?\b|\bearly[- ]stage\b|\bseed\b/.test(text) && parsed.sizeMax == null && parsed.sizeMin == null) {
      parsed.sizeMax = 50; // heuristic: "startups" => small
    }
    if (/\benterprise\b|\blarge\b/.test(text) && parsed.sizeMin == null) parsed.sizeMin = 100;

    // free keywords (for semantic match) — words not consumed by structure
    const stop = new Set(["in","the","a","an","and","or","of","with","for","under","over","less","than","more","fewer",
      "startups","startup","companies","company","employees","people","that","are","is","find","show","me","to","using","who"]);
    parsed.keywords = q.toLowerCase().replace(/[^a-z0-9\s-]/g, " ").split(/\s+/)
      .filter((w) => w && w.length > 2 && !stop.has(w) && isNaN(+w));

    return parsed;
  }

  // ------------------------------------------------------------------ scoring
  function scoreCompany(c, p) {
    let score = 0, reasons = 0;

    if (p.industries.length) {
      if (p.industries.includes(c.industry)) { score += 45; reasons++; }
      else return { score: 0 }; // hard filter on explicit industry
    }
    if (p.country) {
      const ok = p.country === "__EUROPE__" ? EUROPE.includes(c.country) : c.country === p.country;
      if (ok) { score += 25; reasons++; } else return { score: 0 };
    }
    if (p.sizeMax != null) { if (c.size <= p.sizeMax) { score += 15; reasons++; } else return { score: 0 }; }
    if (p.sizeMin != null) { if (c.size >= p.sizeMin) { score += 15; reasons++; } else return { score: 0 }; }

    // semantic-ish keyword match on tags + text
    const hay = (c.name + " " + c.desc + " " + c.sub + " " + c.tags.join(" ")).toLowerCase();
    let kwHits = 0;
    p.keywords.forEach((k) => { if (hay.includes(k)) { kwHits++; } });
    if (p.keywords.length) {
      const frac = kwHits / p.keywords.length;
      score += Math.round(frac * 30);
      if (kwHits) reasons++;
    }

    // baseline relevance so broad queries still rank sensibly
    if (reasons === 0) score += 18;
    score += Math.min(8, c.contacts.filter((x) => x.verified).length * 4); // richer data ranks higher

    // Map the raw signal into a realistic 58–99 band with small deterministic jitter,
    // so results differentiate instead of all pinning to the ceiling.
    const jitter = ([...c.name].reduce((a, ch) => a + ch.charCodeAt(0), 0) % 5) - 2; // -2..+2
    const final = Math.max(55, Math.min(99, Math.round(58 + score * 0.34 + jitter)));
    return { score: final };
  }

  function runSearch(q) {
    state.query = q;
    state.parsed = parseQuery(q);
    const scored = COMPANIES
      .map((c) => ({ c, s: scoreCompany(c, state.parsed).score }))
      .filter((x) => x.s > 0)
      .sort((a, b) => b.s - a.s);
    state.results = scored.map((x) => ({ ...x.c, _match: x.s }));
  }

  // ------------------------------------------------------------------ lookalike
  function lookalike(company) {
    state.query = "Companies similar to " + company.name;
    state.parsed = { raw: state.query, industries: [company.industry], country: null, sizeMin: null, sizeMax: null, keywords: company.tags.slice(), lookalikeOf: company.name };
    const tags = new Set(company.tags);
    const scored = COMPANIES.filter((c) => c.id !== company.id).map((c) => {
      let s = 0;
      if (c.industry === company.industry) s += 40;
      const overlap = c.tags.filter((t) => tags.has(t)).length;
      s += overlap * 12;
      const sizeCloseness = 1 - Math.min(1, Math.abs(c.size - company.size) / 150);
      s += sizeCloseness * 15;
      return { c, s: Math.min(99, 45 + s) };
    }).filter((x) => x.s >= 55).sort((a, b) => b.s - a.s).slice(0, 12);
    state.results = scored.map((x) => ({ ...x.c, _match: Math.round(x.s) }));
    switchView("search");
    renderResults();
    window.scrollTo({ top: 0, behavior: "smooth" });
    toast(`Found ${state.results.length} lookalikes of ${company.name}`);
  }

  // ------------------------------------------------------------------ filters
  function applyFilters(list) {
    const f = state.filters;
    let out = list.filter((c) => {
      if (f.industries.size && !f.industries.has(c.industry)) return false;
      if (f.country && c.country !== f.country) return false;
      if (f.verifiedOnly && !c.contacts.some((x) => x.verified)) return false;
      if (f.size !== "any") {
        if (f.size === "1-20" && !(c.size <= 20)) return false;
        if (f.size === "21-50" && !(c.size > 20 && c.size <= 50)) return false;
        if (f.size === "51-100" && !(c.size > 50 && c.size <= 100)) return false;
        if (f.size === "100+" && !(c.size > 100)) return false;
      }
      return true;
    });
    if (f.sort === "match") out.sort((a, b) => b._match - a._match);
    if (f.sort === "size-desc") out.sort((a, b) => b.size - a.size);
    if (f.sort === "size-asc") out.sort((a, b) => a.size - b.size);
    if (f.sort === "name") out.sort((a, b) => a.name.localeCompare(b.name));
    return out;
  }

  // ------------------------------------------------------------------ rendering: results
  function renderParsed() {
    const p = state.parsed;
    if (!p) return "";
    const tokens = [];
    if (p.lookalikeOf) tokens.push(tok("lookalike", p.lookalikeOf));
    p.industries.forEach((i) => tokens.push(tok("industry", i)));
    if (p.country && p.country !== "__EUROPE__") tokens.push(tok("location", p.country));
    if (p.country === "__EUROPE__") tokens.push(tok("location", "Europe"));
    if (p.sizeMax != null && p.sizeMin != null) tokens.push(tok("size", `${p.sizeMin}–${p.sizeMax} employees`));
    else if (p.sizeMax != null) tokens.push(tok("size", `≤ ${p.sizeMax} employees`));
    else if (p.sizeMin != null) tokens.push(tok("size", `≥ ${p.sizeMin} employees`));
    p.keywords.filter((k) => !p.lookalikeOf).slice(0, 4).forEach((k) => tokens.push(tok("keyword", k)));
    if (!tokens.length) return "";
    return `<div class="parsed"><span class="rq" style="align-self:center;margin-right:4px">AI understood:</span>${tokens.join("")}</div>`;
  }
  const tok = (k, v) => `<span class="token"><span class="k">${k}</span>${escapeHtml(v)}</span>`;

  function renderResults() {
    switchView("search");
    $("#hero").style.display = "none";
    const filtered = applyFilters(state.results);
    const wrap = $("#results");
    wrap.innerHTML = `
      <div class="inline-search">
        <span class="si">🔎</span>

      </div>
      <div class="results-head">

  }

  // Template-driven "AI" personalization (deterministic, offline)

  // ------------------------------------------------------------------ CSV export
  function exportCSV(companies, filename) {
    const header = ["Company", "Domain", "Industry", "City", "Country", "Employees", "Revenue", "Match %", "Contacts", "Verified emails"];
    const rows = companies.map((c) => [c.name, c.domain, c.industry, c.city, c.country, c.size, c.revenue, c._match || "",
      c.contacts.length, c.contacts.filter((x) => x.verified).length]);
    download(filename, toCSV([header, ...rows]));
    toast(`Exported ${companies.length} companies`);
  }
  function exportContactsCSV(companies, filename) {
    const header = ["Company", "Domain", "Industry", "Location", "Employees", "Contact name", "Title", "Seniority", "Email", "Email status", "LinkedIn"];
    const rows = [];
    companies.forEach((c) => c.contacts.forEach((p) => rows.push([c.name, c.domain, c.industry, `${c.city}, ${c.country}`, c.size,
      p.name, p.title, p.seniority, p.email, p.verified ? "Verified" : "Unverified", "linkedin.com/" + p.linkedin])));
    download(filename, toCSV([header, ...rows]));
    toast(`Exported ${rows.length} contacts`);
  }
  function toCSV(rows) { return rows.map((r) => r.map((v) => { const s = String(v == null ? "" : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\n"); }

  async function download(filename, text) {
    // Hosted-artifact path: the sandbox blocks direct downloads, so use the
    // downloads capability when the page is running inside claude.ai.
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
    if (dl) {
      try {
        await dl.save({ filename, data: text });
      } catch (e) {
        if (e && e.code === "extension_not_enabled") {
          try { await dl.save({ filename: filename.replace(/\.csv$/, ".txt"), data: text }); }
          catch (e2) { if (e2 && e2.code === "declined") return; toast("Export unavailable in this view"); }
        } else if (e && e.code === "declined") { return; }
        else { toast("Export unavailable in this view"); }
      }
      return;
    }
    // Local / standalone path: classic blob download.
    const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ------------------------------------------------------------------ misc UI
  function switchView(name) {
    $$(".view").forEach((v) => v.classList.toggle("active", v.dataset.view === name));
    $$(".topnav button").forEach((b) => b.classList.toggle("active", b.dataset.nav === name));
    if (name === "lists") renderLists();
  }
  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.innerHTML = `<span class="dot"></span>${escapeHtml(msg)}`;
    $("#toasts").appendChild(t);
    setTimeout(() => { t.style.opacity = "0"; t.style.transition = "0.3s"; setTimeout(() => t.remove(), 300); }, 2600);
  }
  function copyText(t) { navigator.clipboard && navigator.clipboard.writeText(t).catch(() => {}); }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }
  function escapeAttr(s) { return escapeHtml(s).replace(/"/g, "&quot;"); }

  function doSearch() {
    const q = $("#searchInput").value.trim();
    if (!q) { $("#searchInput").focus(); return; }
    $("#hero").style.display = "none";
    $("#results").innerHTML = `<div class="loading"><div class="spinner"></div>Scanning 75M companies for “${escapeHtml(q)}”…</div>`;
    switchView("search");
    setTimeout(() => { runSearch(q); renderResults(); }, 650); // simulate query latency
  }

  // ------------------------------------------------------------------ init
  function init() {
    $("#searchBtn").onclick = doSearch;
    $("#searchInput").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
    $$(".chip").forEach((ch) => ch.onclick = () => { $("#searchInput").value = ch.dataset.q; doSearch(); });
    $$(".topnav button").forEach((b) => b.onclick = () => {
      switchView(b.dataset.nav);
      if (b.dataset.nav === "search" && !state.results.length) { $("#hero").style.display = ""; }
    });
    $("#modalBg").onclick = (e) => { if (e.target.id === "modalBg") closeModal(); };
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
    $("#brandHome").onclick = () => { switchView("search"); $("#hero").style.display = ""; $("#results").innerHTML = ""; $("#searchInput").value = ""; };
    updateListBadge();
    // expose a couple hooks for testing
    window.__explee = { runSearch, state, doSearch };
  }
  document.addEventListener("DOMContentLoaded", init);
})();

</script>
