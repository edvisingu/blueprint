<title>Dr. D Lead Engineering System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
/* Dr. D Lead Engineering System
 *
 * Layout: an operations console. Fixed left rail on desktop that collapses to a
 * bottom tab bar on phones. One measured content column. Data tables run flush
 * and hairline-ruled; radius and fill are reserved for things you can act on,
 * so the surface treatment carries hierarchy instead of flattening it.
 *
 * Brand-locked per the EdVisingU design system: Montserrat only, navy #0A1628,
 * gold #C9A84C. Deliberately single-theme dark, so every colour is painted
 * explicitly and color-scheme is pinned.
 */

:root {
  color-scheme: dark;

  /* ground — navy stepped, each surface a deliberate level */
  --ink: #0A1628;
  --ink-1: #0C1A2F;
  --ink-2: #101F38;
  --ink-3: #152741;
  --ink-4: #1C314E;

  /* lines — navy-biased, never neutral grey */
  --rule: #1B2C47;
  --rule-soft: #15243B;
  --rule-strong: #26395A;

  /* accent — one place only */
  --gold: #C9A84C;
  --gold-lift: #E3C878;
  --gold-deep: #9C7F2E;
  --gold-wash: rgba(201, 168, 76, 0.10);
  --gold-edge: rgba(201, 168, 76, 0.32);

  /* type — warm-biased neutrals so nothing reads as default grey */
  --fg: #F4F6FA;
  --fg-2: #AEB8C9;
  --fg-3: #7C889C;
  --fg-4: #566275;

  /* state — semantic, held apart from the accent */
  --up: #4ECB8E;
  --up-wash: rgba(78, 203, 142, 0.12);
  --mid: #E89B4C;
  --mid-wash: rgba(232, 155, 76, 0.12);
  --down: #E8637C;
  --down-wash: rgba(232, 99, 124, 0.12);

  /* form */
  --r-sm: 6px;
  --r: 10px;
  --r-lg: 14px;
  --rail: 232px;
  --tabbar: 62px;
  --font: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* Compatibility aliases. The views carry inline colours written against the
     previous token names; these map them onto the current palette so there is
     one source of truth for the values. */
  --muted: var(--fg-2);
  --faint: var(--fg-4);
  --white: var(--fg);
  --border: var(--rule);
  --border-soft: var(--rule-soft);
  --gold-bright: var(--gold-lift);
  --gold-line: var(--gold-edge);
  --gold-dim: var(--gold-wash);
  --navy-900: var(--ink);
  --navy-850: var(--ink-1);
  --navy-800: var(--ink-1);
  --navy-750: var(--ink-2);
  --navy-700: var(--ink-3);
  --navy-600: var(--ink-4);
  --good: var(--up);
  --good-dim: var(--up-wash);
  --warn: var(--mid);
  --warn-dim: var(--mid-wash);
  --bad: var(--down);
  --bad-dim: var(--down-wash);

  /* type scale — six sizes, held to */
  --t-micro: 10px;
  --t-fine: 11.5px;
  --t-body: 13px;
  --t-lead: 14.5px;
  --t-head: 19px;
  --t-display: 27px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--ink);
  color: var(--fg);
  font-size: var(--t-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; }
button { cursor: pointer; background: none; border: none; color: inherit; }
svg { display: block; flex: none; }
::selection { background: var(--gold-edge); color: var(--fg); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* uppercase micro-label: wide tracking, used for every field and section name */
.label {
  font-size: var(--t-micro); font-weight: 600; letter-spacing: 0.13em;
  text-transform: uppercase; color: var(--fg-4);
}
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.grow { flex: 1; min-width: 0; }

/* ======================================================== SHELL */
.app { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 100%; }

.sidebar {
  background: var(--ink-1);
  border-right: 1px solid var(--rule);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  scrollbar-width: thin;
}
.brand { padding: 20px 18px 18px; }
.brand .mark {
  display: flex; align-items: center; gap: 11px;
  font-weight: 700; font-size: var(--t-body); letter-spacing: -0.005em; line-height: 1.25;
}
/* monogram: squared, not a rounded pill */
.brand .mono {
  width: 30px; height: 30px; flex: none; border-radius: 3px;
  background: var(--gold); color: var(--ink);
  display: grid; place-items: center;
  font-weight: 800; font-size: var(--t-fine); letter-spacing: 0.02em;
}
.brand .sub {
  font-size: var(--t-micro); color: var(--fg-4); letter-spacing: 0.13em;
  text-transform: uppercase; margin-top: 10px; font-weight: 600;
}

/* brand switcher */
.brandswitch { padding: 0 14px 16px; }
.brandswitch label {
  font-size: var(--t-micro); letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--fg-4); font-weight: 600; display: block; margin-bottom: 7px;
}
.brandswitch select {
  width: 100%; background: var(--ink-3); border: 1px solid var(--rule-strong);
  color: var(--fg); border-radius: var(--r-sm); padding: 9px 10px;
  font-weight: 600; outline: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%),
                    linear-gradient(135deg, var(--fg-3) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
.brandswitch select:focus { border-color: var(--gold); }
.brandswitch .fitline { font-size: var(--t-micro); color: var(--fg-4); margin-top: 8px; letter-spacing: 0.02em; }
.brandswitch .fitline b { color: var(--gold-lift); font-weight: 700; }

/* nav — filled chip when active, no accent rail */
.nav { padding: 0 10px 14px; display: flex; flex-direction: column; gap: 1px; flex: 1; }
.nav .group {
  font-size: var(--t-micro); letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--fg-4); padding: 16px 10px 7px; font-weight: 600;
}
.nav button {
  display: flex; align-items: center; gap: 11px; width: 100%;
  color: var(--fg-3); padding: 9px 10px; border-radius: var(--r-sm);
  font-weight: 500; text-align: left; transition: background .12s, color .12s;
}
.nav button:hover { background: var(--ink-2); color: var(--fg); }
.nav button.on { background: var(--ink-4); color: var(--fg); font-weight: 600; }
.nav button .ic { color: currentColor; opacity: .85; }
.nav button.on .ic { color: var(--gold); opacity: 1; }
.nav button .badge {
  margin-left: auto; background: var(--gold); color: var(--ink);
  font-size: var(--t-micro); font-weight: 700; border-radius: 3px;
  padding: 2px 6px; min-width: 19px; text-align: center; font-variant-numeric: tabular-nums;
}

.side-foot { padding: 14px; border-top: 1px solid var(--rule); }
.plan { font-size: var(--t-fine); }
.plan .row { display: flex; justify-content: space-between; color: var(--fg-3); }
.plan .row b { color: var(--fg); }
.plan .bar { height: 3px; background: var(--ink-4); border-radius: 2px; margin: 8px 0 6px; overflow: hidden; }
.plan .bar i { display: block; height: 100%; background: var(--gold); }

/* ======================================================== HEADER */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  min-height: 58px; flex: none; display: flex; align-items: center; gap: 12px;
  padding: 10px 24px; border-bottom: 1px solid var(--rule);
  background: var(--ink-1);
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
}
.topbar h1 { font-size: var(--t-lead); font-weight: 700; letter-spacing: -0.01em; }
.agent-pill {
  display: flex; align-items: center; gap: 7px; font-size: var(--t-fine); color: var(--fg-3);
  border: 1px solid var(--rule-strong); border-radius: 20px; padding: 5px 11px; white-space: nowrap;
}
.agent-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--up); flex: none; }
.agent-pill:not(.off) .dot { animation: breathe 2.6s ease-in-out infinite; }
.agent-pill.off .dot { background: var(--fg-4); }
@keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
.who {
  width: 30px; height: 30px; border-radius: 3px; background: var(--ink-4); flex: none;
  display: grid; place-items: center; font-size: var(--t-fine); font-weight: 700; color: var(--fg-2);
}

.page { padding: 22px 24px 40px; max-width: 1340px; width: 100%; }
.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; margin-bottom: 22px; flex-wrap: wrap;
}
.page-head h2 {
  font-size: var(--t-head); font-weight: 800; letter-spacing: -0.022em; text-wrap: balance;
}
.page-head p { color: var(--fg-3); font-size: var(--t-fine); margin-top: 5px; max-width: 68ch; line-height: 1.55; }
.head-actions { display: flex; gap: 7px; flex-wrap: wrap; }

/* ======================================================== CONTROLS */
.btn {
  background: var(--gold); color: var(--ink); border: 1px solid var(--gold);
  border-radius: var(--r-sm); padding: 8px 14px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover { background: var(--gold-lift); border-color: var(--gold-lift); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--fg-2); border-color: var(--rule-strong); }
.btn.ghost:hover { background: var(--ink-3); color: var(--fg); border-color: var(--fg-4); }
.btn.sm { padding: 6px 11px; font-size: var(--t-fine); }
.btn.danger { background: transparent; color: var(--down); border-color: rgba(232,99,124,.38); }
.btn.danger:hover { background: var(--down-wash); }
.btn[disabled] { opacity: .4; pointer-events: none; }

.input, .select, .ta {
  width: 100%; background: var(--ink); border: 1px solid var(--rule-strong);
  color: var(--fg); border-radius: var(--r-sm); padding: 9px 11px; outline: none;
}
.input:focus, .select:focus, .ta:focus { border-color: var(--gold); }
.input::placeholder, .ta::placeholder { color: var(--fg-4); }
.ta { min-height: 118px; resize: vertical; line-height: 1.6; }
.field { display: block; margin-bottom: 14px; }
.field > span {
  display: block; font-size: var(--t-micro); color: var(--fg-4); margin-bottom: 6px;
  font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
}

/* pills — squared, so they read as status not decoration */
.pill {
  display: inline-flex; align-items: center; gap: 5px; font-size: var(--t-micro);
  font-weight: 700; border-radius: 3px; padding: 3px 7px; white-space: nowrap;
  letter-spacing: 0.04em; text-transform: uppercase;
}
.pill.gold { background: var(--gold-wash); color: var(--gold-lift); }
.pill.good { background: var(--up-wash); color: var(--up); }
.pill.warn { background: var(--mid-wash); color: var(--mid); }
.pill.bad { background: var(--down-wash); color: var(--down); }
.pill.muted { background: var(--ink-4); color: var(--fg-3); }

.chip {
  font-size: var(--t-fine); color: var(--fg-2); background: var(--ink-3);
  border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 3px 8px;
}
.chips { display: flex; flex-wrap: wrap; gap: 5px; }

.score { display: inline-flex; align-items: baseline; gap: 2px; font-weight: 800; font-variant-numeric: tabular-nums; }
.score b { font-size: var(--t-lead); letter-spacing: -0.02em; }
.score span { font-size: var(--t-micro); color: var(--fg-4); font-weight: 600; }
.score.hi b { color: var(--gold-lift); }
.score.mid b { color: var(--fg); }
.score.lo b { color: var(--fg-3); }

.toggle { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
.toggle .tr {
  width: 36px; height: 20px; border-radius: 11px; background: var(--ink-4);
  position: relative; transition: background .15s; flex: none;
}
.toggle .tr::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px;
  border-radius: 50%; background: var(--fg-3); transition: .15s;
}
.toggle input:checked + .tr { background: var(--gold); }
.toggle input:checked + .tr::after { left: 19px; background: var(--ink); }
.toggle input:focus-visible + .tr { outline: 2px solid var(--gold); outline-offset: 2px; }
.checkbox { width: 15px; height: 15px; accent-color: var(--gold); cursor: pointer; }

/* ======================================================== SURFACES
   Cards are for things you act on. Data gets rules, not boxes. */
.card { background: var(--ink-1); border: 1px solid var(--rule); border-radius: var(--r-lg); }
.card.pad { padding: 17px; }
.card-h {
  padding: 13px 17px; border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; gap: 10px;
}
.card-h h3 { font-size: var(--t-body); font-weight: 700; letter-spacing: -0.005em; }
.card-b { padding: 17px; }

/* stat tiles — flush row divided by rules, not a grid of boxes */
.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(146px, 1fr));
  border: 1px solid var(--rule); border-radius: var(--r-lg);
  background: var(--ink-1); overflow: hidden; margin-bottom: 20px;
}
.stat { padding: 14px 16px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.stat .k { font-size: var(--t-micro); letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-4); font-weight: 600; }
.stat .v {
  font-size: var(--t-display); font-weight: 800; margin-top: 7px;
  letter-spacing: -0.032em; font-variant-numeric: tabular-nums; line-height: 1;
}
.stat .d { font-size: var(--t-micro); color: var(--fg-3); margin-top: 6px; }
.stat.accent .v { color: var(--gold-lift); }
.stat.accent .k { color: var(--gold-deep); }

/* ======================================================== TABLES */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r-lg); background: var(--ink-1); }
table.tbl { width: 100%; border-collapse: collapse; }
table.tbl th {
  text-align: left; font-size: var(--t-micro); letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--fg-4); font-weight: 600; padding: 11px 14px;
  border-bottom: 1px solid var(--rule-strong); background: var(--ink-2);
  position: sticky; top: 0; white-space: nowrap;
}
table.tbl td {
  padding: 11px 14px; border-bottom: 1px solid var(--rule-soft);
  color: var(--fg-2); vertical-align: middle;
}
table.tbl tr:last-child td { border-bottom: none; }
table.tbl tbody tr { cursor: pointer; transition: background .1s; }
table.tbl tbody tr:hover td { background: var(--ink-2); }
table.tbl .prime { color: var(--fg); font-weight: 600; }
table.tbl .sub { font-size: var(--t-micro); color: var(--fg-4); margin-top: 2px; }
td.right, th.right { text-align: right; }

/* ======================================================== LAYOUT HELPERS */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.split { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; align-items: start; }
.rowflex { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 11px; }
.sec { margin-bottom: 20px; }
.sec > .label { margin-bottom: 9px; display: block; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 13px 20px; }
.kv .k { font-size: var(--t-micro); color: var(--fg-4); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
.kv .v { font-size: var(--t-body); color: var(--fg); margin-top: 3px; }

/* ======================================================== SEARCH */
.searchbar {
  display: flex; align-items: center; gap: 10px; background: var(--ink-1);
  border: 1px solid var(--rule-strong); border-radius: var(--r); padding: 5px 5px 5px 13px;
  margin-bottom: 13px;
}
.searchbar:focus-within { border-color: var(--gold); }
.searchbar input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--fg); font-size: var(--t-lead); padding: 9px 0; }
.searchbar input::placeholder { color: var(--fg-4); }
.searchbar .ic { color: var(--fg-4); }
.inline-search { composes: searchbar; }
.examples { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.examples button {
  font-size: var(--t-fine); color: var(--fg-3); background: var(--ink-1);
  border: 1px solid var(--rule); border-radius: 20px; padding: 6px 12px;
}
.examples button:hover { color: var(--fg); border-color: var(--gold-edge); }

.criteria { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; align-items: center; }
.crit {
  display: inline-flex; align-items: baseline; gap: 6px; font-size: var(--t-fine);
  background: var(--gold-wash); border: 1px solid var(--gold-edge); color: var(--gold-lift);
  border-radius: var(--r-sm); padding: 3px 9px;
}
.crit i {
  font-style: normal; font-size: var(--t-micro); letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--gold-deep); font-weight: 600;
}

/* ======================================================== CHARTS */
.bd { display: flex; flex-direction: column; gap: 8px; }
.bd .r { display: grid; grid-template-columns: minmax(96px, 128px) 1fr 40px; gap: 10px; align-items: center; font-size: var(--t-fine); }
.bd .r .n { color: var(--fg-3); }
.bd .r .t { height: 4px; background: var(--ink-4); border-radius: 2px; overflow: hidden; }
.bd .r .t i { display: block; height: 100%; background: var(--gold); }
.bd .r .v { text-align: right; color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

.bars { display: flex; flex-direction: column; gap: 13px; }
.bars .b { display: grid; grid-template-columns: 1fr 44px; gap: 12px; align-items: end; }
.bars .b .lbl { font-size: var(--t-fine); color: var(--fg-3); margin-bottom: 6px; }
.bars .b .track { height: 5px; background: var(--ink-4); border-radius: 3px; overflow: hidden; }
.bars .b .track i { display: block; height: 100%; background: var(--gold); border-radius: 3px; }
.bars .b .val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ======================================================== FEED */
.feed { display: flex; flex-direction: column; }
.feed .it { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
.feed .it:last-child { border-bottom: none; }
.feed .st {
  font-size: 9px; letter-spacing: 0.08em; font-weight: 700; color: var(--gold-lift);
  background: var(--gold-wash); border-radius: 2px; padding: 3px 5px; text-align: center; height: fit-content;
}
.feed .tx { font-size: var(--t-fine); color: var(--fg-2); line-height: 1.5; }
.feed .tm { font-size: var(--t-micro); color: var(--fg-4); margin-top: 3px; }

/* ======================================================== INBOX */
.inbox {
  display: grid; grid-template-columns: 320px 1fr;
  border: 1px solid var(--rule); border-radius: var(--r-lg); overflow: hidden;
  background: var(--ink-1); min-height: 520px;
}
.thread-list { border-right: 1px solid var(--rule); overflow-y: auto; max-height: 72vh; }
.thread { padding: 12px 14px; border-bottom: 1px solid var(--rule-soft); cursor: pointer; transition: background .1s; }
.thread:hover { background: var(--ink-2); }
.thread.on { background: var(--ink-3); }
.thread .t1 { display: flex; align-items: center; gap: 8px; }
.thread .nm { font-size: var(--t-body); font-weight: 600; color: var(--fg); }
.thread .co { font-size: var(--t-micro); color: var(--fg-4); margin-top: 2px; }
.thread .pv {
  font-size: var(--t-fine); color: var(--fg-3); margin-top: 6px; line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.thread-view { padding: 18px; overflow-y: auto; max-height: 72vh; }
.msg { border: 1px solid var(--rule); border-radius: var(--r); padding: 13px; margin-bottom: 11px; background: var(--ink-2); }
.msg.in { border-left: 2px solid var(--gold); background: var(--ink-3); }
.msg .mh { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.msg .mh .who2 { font-size: var(--t-fine); font-weight: 600; }
.msg .mh .when { font-size: var(--t-micro); color: var(--fg-4); margin-left: auto; }
.msg pre { font-family: var(--font); font-size: var(--t-body); color: var(--fg-2); white-space: pre-wrap; line-height: 1.62; }

/* ======================================================== DRAWER */
.veil { position: fixed; inset: 0; background: rgba(5, 10, 20, .72); display: none; z-index: 60; }
.veil.on { display: block; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100%; width: min(660px, 100vw);
  background: var(--ink-1); border-left: 1px solid var(--rule);
  z-index: 61; transform: translateX(100%); transition: transform .2s ease;
  display: flex; flex-direction: column;
}
.drawer.on { transform: none; }
.drawer-h {
  padding: 16px 20px; border-bottom: 1px solid var(--rule);
  display: flex; align-items: flex-start; gap: 12px; flex: none;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
}
.drawer-h h3 { font-size: var(--t-head); font-weight: 800; letter-spacing: -0.02em; }
.drawer-h .sub { font-size: var(--t-fine); color: var(--fg-3); margin-top: 3px; }
.drawer-h .x { margin-left: auto; color: var(--fg-4); font-size: 22px; line-height: 1; padding: 0 4px; }

  const REGION_WORDS = { "ontario": "Ontario", "british columbia": "British Columbia", "quebec": "Quebec", "alberta": "Alberta", "england": "England", "scotland": "Scotland" };
  const INDUSTRY_WORDS = {
    "Higher Education": ["higher education", "university", "universities", "college", "colleges", "polytechnic", "post-secondary", "postsecondary", "institution", "institutions", "campus"],
    "EdTech": ["edtech", "ed tech", "education technology", "learning software", "lms"],
    "Professional Services": ["professional services", "consulting", "consultancy", "consultancies", "law firm", "accounting", "advisory"],
    "Corporate Training": ["corporate training", "l&d", "learning and development", "training", "workforce development"],
    "Agency": ["agency", "agencies", "creative studio", "marketing agency"],
    "SaaS": ["saas", "software", "b2b software", "platform", "developer tools"],
    "Fintech": ["fintech", "payments", "lending", "financial", "banking", "payroll"],
    "HealthTech": ["healthtech", "health tech", "healthcare", "clinical", "telehealth", "medical"],
    "Nonprofit": ["nonprofit", "non-profit", "charity", "foundation", "association"],
    "Cybersecurity": ["cybersecurity", "security", "infosec"],
    "Sports Club": ["sports club", "sports clubs", "sport club", "club", "clubs", "soccer", "hockey",
      "basketball", "volleyball", "lacrosse", "baseball", "academy", "academies", "travel team",
      "travel teams", "youth sports", "athletic club", "sports organization", "sports organisation"],
    "School Athletics": ["school athletics", "athletic department", "athletic departments", "athletics",
      "high school sports", "prep program", "prep athletics", "college athletics", "interscholastic",
      "athletic director", "nil"],
  };
  const TECH_WORDS = ["hubspot", "salesforce", "canvas lms", "canvas", "banner", "slate crm", "slate", "aws", "stripe", "snowflake", "segment", "react", "workday", "docebo", "okta", "zoom", "webflow", "figma", "plaid", "epic", "twilio", "qualtrics", "articulate"];
  const SIGNAL_PATTERNS = [
    { re: /hir(?:ing|ed) (?:sales|revenue|gtm)/i, signal: "Hiring sales leaders" },
    { re: /recently funded|raised|funding/i, signal: "Recently funded" },
    { re: /new (?:executive|exec|leader|hire)/i, signal: "New executive hire" },
    { re: /expand(?:ing|ed)?/i, signal: "Expanding to new region" },
    { re: /ai roles?|ai hiring|hiring ai/i, signal: "Job posts for AI roles" },
    { re: /ai policy/i, signal: "Published AI policy" },
    { re: /new program|launched/i, signal: "Launched new program" },
  ];
  const SENIORITY_WORDS = { "c-suite": "C-Suite", "ceo": "C-Suite", "cto": "C-Suite", "cfo": "C-Suite", "chief": "C-Suite", "founder": "C-Suite", "executive": "C-Suite", "vp": "VP", "vice president": "VP", "head of": "Head", "director": "Director", "dean": "Director", "manager": "Manager" };
  const DEPT_WORDS = { "sales": "Sales", "marketing": "Marketing", "product": "Product & Eng", "engineering": "Product & Eng", "l&d": "People & L&D", "hr": "People & L&D", "people": "People & L&D", "academic": "Academic", "teaching": "Academic" };

  const STOP = new Set(["find","show","me","get","all","the","a","an","and","or","of","with","that","who","are","is","in","at","to","for","from","under","over","between","less","than","more","fewer","companies","company","people","person","organizations","employees","staff","using","use","uses","have","has","recently","their","its"]);

  function parseQuery(q) {
    const t = " " + String(q).toLowerCase().replace(/[^a-z0-9&+\-\s.]/g, " ").replace(/\s+/g, " ") + " ";
    const c = { raw: q, industries: [], country: null, region: null, city: null, sizeMin: null, sizeMax: null,
      tech: [], signals: [], titles: [], seniority: [], departments: [], keywords: [], funded: false };

    for (const [ind, words] of Object.entries(INDUSTRY_WORDS))
      if (words.some((w) => t.includes(" " + w + " ") || t.includes(" " + w + "s "))) c.industries.push(ind);

    for (const [w, r] of Object.entries(REGION_WORDS)) if (t.includes(" " + w + " ")) c.region = r;
    for (const [w, cn] of Object.entries(COUNTRY_ALIASES)) if (t.includes(" " + w + " ")) { c.country = cn; break; }
    D.vocab.GEO.forEach((g) => g.cities.forEach((city) => { if (t.includes(" " + city.toLowerCase() + " ")) { c.city = city; c.country = g.country; } }));

    TECH_WORDS.forEach((w) => { if (t.includes(" " + w)) c.tech.push(w); });
    SIGNAL_PATTERNS.forEach((s) => { if (s.re.test(q)) c.signals.push(s.signal); });
    if (/\bfunded\b|\braised\b|\bfunding\b/.test(t)) c.funded = true;

    // size: "25-200", "under 50", "over 100", "50+", "between 10 and 90"
    let m;
    if ((m = t.match(/(\d+)\s*(?:-|–|to|and)\s*(\d+)/))) { c.sizeMin = +m[1]; c.sizeMax = +m[2]; }
    if ((m = t.match(/(?:under|below|less than|fewer than|up to)\s*(\d+)/))) c.sizeMax = +m[1];
    if ((m = t.match(/(?:over|above|more than|at least)\s*(\d+)/))) c.sizeMin = +m[1];
    if ((m = t.match(/(\d+)\s*\+/))) c.sizeMin = +m[1];
    if (/\bstartups?\b|\bearly[- ]stage\b|\bsmall\b/.test(t) && c.sizeMax == null && c.sizeMin == null) c.sizeMax = 60;
    if (/\benterprise\b|\blarge\b/.test(t) && c.sizeMin == null) c.sizeMin = 400;

    for (const [w, s] of Object.entries(SENIORITY_WORDS)) if (t.includes(" " + w)) if (!c.seniority.includes(s)) c.seniority.push(s);
    for (const [w, d] of Object.entries(DEPT_WORDS)) if (t.includes(" " + w)) if (!c.departments.includes(d)) c.departments.push(d);
    ["ceo","cto","cfo","ciso","chro","dean","registrar","principal","provost","partner","founder","director of teaching & learning","head of l&d","vp academic"]
      .forEach((w) => { if (t.includes(" " + w)) c.titles.push(w); });

    c.keywords = t.split(" ").filter((w) => w.length > 2 && !STOP.has(w) && isNaN(+w));
    return c;
  }

  // ===================================================== MATCHING
  function companyMatches(co, c) {
    if (c.industries.length && !c.industries.includes(co.industry)) return false;
    if (c.country && co.country !== c.country) return false;
    if (c.region && co.region !== c.region) return false;
    if (c.city && co.city !== c.city) return false;
    if (c.sizeMin != null && co.size < c.sizeMin) return false;
    if (c.sizeMax != null && co.size > c.sizeMax) return false;
    if (c.funded && !co.funding) return false;
    if (c.tech.length && !c.tech.some((tw) => co.tech.some((ct) => ct.toLowerCase().includes(tw)))) return false;
    if (c.signals.length && !c.signals.some((s) => co.signals.includes(s))) return false;
    return true;
  }

  function searchCompanies(query, opts) {
    opts = opts || {};
    const c = typeof query === "string" ? parseQuery(query) : query;
    const icp = opts.icp || null;
    const out = [];
    D.companies.forEach((co) => {
      if (!companyMatches(co, c)) return;
      const sc = scoreCompany(co, c, icp);
      out.push(Object.assign({}, co, { _score: sc.total, _breakdown: sc, _reason: fitReason(co, c, icp) }));
    });
    out.sort((a, b) => b._score - a._score);
    return { criteria: c, results: out };
  }

  function searchPeople(query, opts) {
    opts = opts || {};
    const c = typeof query === "string" ? parseQuery(query) : query;
    const out = [];
    D.people.forEach((p) => {
      const co = companyById(p.companyId);
      if (!companyMatches(co, c)) return;
      if (c.seniority.length && !c.seniority.includes(p.seniority)) return;
      if (c.departments.length && !c.departments.includes(p.department)) return;
      if (c.titles.length && !c.titles.some((tw) => p.title.toLowerCase().includes(tw))) return;
      const sc = scoreCompany(co, c, opts.icp || null);
      const bonus = (p.seniority === "C-Suite" ? 8 : p.seniority === "VP" ? 5 : p.seniority === "Head" ? 3 : 0) + (p.verified ? 5 : 0);
      out.push(Object.assign({}, p, { company: co, _score: Math.min(99, sc.total + bonus), _breakdown: sc,
        _reason: `${p.title} at a ${co.size}-person ${co.industry.toLowerCase()} organization in ${co.city}. ${p.verified ? "Email verified." : "Email needs verification."}` }));
    });
    out.sort((a, b) => b._score - a._score);
    return { criteria: c, results: out };
  }

  // ===================================================== LEAD SCORING (spec §U)
  // Deterministic sub-scores that add to an explainable 0-100 overall score.
  function scoreCompany(co, c, icp) {
    // 1. Company fit (0-30)
    let companyFit = 12;
    if (c && c.industries.length && c.industries.includes(co.industry)) companyFit += 10;
    if (icp) {
      if (icp.industry === co.industry) companyFit += 12;
      if (icp.country && icp.country === co.country) companyFit += 4;
      if (icp.sizeMin && co.size >= icp.sizeMin) companyFit += 4;
    }
    companyFit = Math.min(30, companyFit);

    // 2. Buyer fit (0-20) — do the right roles exist here?
    const staff = D.peopleByCompany[co.id] || [];
    const senior = staff.filter((p) => p.seniority === "C-Suite" || p.seniority === "VP" || p.seniority === "Head").length;
    const buyerFit = Math.min(20, 6 + senior * 5);

    // 3. Intent signal (0-20)
    const intent = Math.min(20, co.signals.length * 7 + (co.funding ? 4 : 0));

    // 4. Timing (0-10)
    let timing = 3;
    if (co.funding && +co.funding.date >= 2025) timing += 4;
    if (co.signals.some((s) => /Hiring|New executive|Expanding/.test(s))) timing += 4;
    timing = Math.min(10, timing);

    // 5. Data confidence (0-10)
    const verified = staff.filter((p) => p.verified).length;
    const dataConfidence = Math.min(10, 2 + verified * 3);

    // 6. Personalization strength (0-10) — how much do we have to write about?
    const personalization = Math.min(10, 2 + co.signals.length * 2 + co.tech.length + (co.funding ? 2 : 0));

    const total = Math.max(38, Math.min(99, companyFit + buyerFit + intent + timing + dataConfidence + personalization));
    return { companyFit, buyerFit, intent, timing, dataConfidence, personalization, total,
      band: total >= 85 ? "HIGH PRIORITY" : total >= 70 ? "STRONG" : total >= 55 ? "MODERATE" : "LOW" };
  }

  function fitReason(co, c, icp) {
    const bits = [];
    if (icp && icp.industry === co.industry) bits.push(`matches your "${icp.name}" ICP`);
    else if (c && c.industries.includes(co.industry)) bits.push(`${co.industry} match`);
    if (co.signals.length) bits.push(co.signals[0].toLowerCase());
    if (co.funding) bits.push(`${co.funding.round} ${co.funding.amount} (${co.funding.date})`);
    const staff = D.peopleByCompany[co.id] || [];
    if (staff.length) bits.push(`${staff.length} reachable decision-maker${staff.length === 1 ? "" : "s"}`);
    return bits.length ? bits.join(" · ") : `${co.size}-person ${co.industry.toLowerCase()} organization in ${co.city}`;
  }

  // ===================================================== DEEP RESEARCH (spec §D)
  function deepResearch(co, person) {
    const staff = D.peopleByCompany[co.id] || [];
    const dm = person || staff[0];
    const pains = co.pains || [];
    return {
      companyId: co.id, generatedAt: Date.now(),
      overview: `${co.name} is a ${co.size}-person ${co.sub.toLowerCase()} organization in the ${co.industry.toLowerCase()} sector, headquartered in ${co.city}, ${co.country}. ${co.desc} Founded ${co.founded}; estimated revenue ${co.revenue}.`,
      buyingSignals: co.signals.length ? co.signals.map((s) => ({ signal: s, weight: /Hiring|funded|executive/i.test(s) ? "Strong" : "Moderate" }))
        : [{ signal: "No public trigger detected in the last 90 days", weight: "Weak" }],
      painPoints: pains.slice(0, 3),
      productFit: `Their ${co.industry.toLowerCase()} profile maps to the ${co.size > 200 ? "institution-wide readiness audit" : "focused training cohort"} offer. ${co.tech.length ? "Existing stack (" + co.tech.join(", ") + ") means integration friction is low." : ""}`,
      whyNow: co.funding && +co.funding.date >= 2025 ? `Fresh ${co.funding.round} capital (${co.funding.amount}, ${co.funding.date}) usually unlocks discretionary program budget within two quarters.`
        : co.signals.some((s) => /Hiring/.test(s)) ? "Active hiring signals a growth mandate with budget attached; new leaders buy in their first 90 days."
        : co.signals.some((s) => /AI policy/.test(s)) ? "They have published an AI position publicly, which means the mandate exists and implementation is the open gap."
        : "No urgent trigger. Treat as a nurture-tier account rather than a priority send.",
      competitors: pickCompetitors(co),
      initiatives: co.signals.length ? co.signals.map((s) => `Public signal: ${s}`) : ["No public initiatives detected"],
      technologies: co.tech,
      decisionMaker: dm ? { name: dm.name, title: dm.title, seniority: dm.seniority, email: dm.email, status: dm.emailStatus } : null,
      angles: buildAngles(co, dm),
      recommendation: co.signals.length >= 2 ? "Send now. Lead with the strongest trigger in the first line."
        : co.signals.length === 1 ? "Send this week. Anchor on the single trigger and keep the ask small."
        : "Hold for nurture. Not enough context for a credible personalized opener.",
      sources: [`${co.domain} (site analysis)`, "Public job postings", "Funding & press records", "Technology fingerprint"],
    };
  }
  function pickCompetitors(co) {
    return D.companies.filter((x) => x.id !== co.id && x.industry === co.industry && Math.abs(x.size - co.size) < co.size * 0.9)
      .slice(0, 3).map((x) => x.name);
  }
  function buildAngles(co, dm) {
    const a = [];
    if (co.signals.includes("Hiring sales leaders")) a.push("They are hiring revenue leaders — new leaders need their team ramped fast.");
    if (co.signals.includes("Published AI policy")) a.push("They published an AI policy — implementation support is the obvious next gap.");
    if (co.funding) a.push(`Recent ${co.funding.round} means budget cycles are open.`);
    if (co.tech.length) a.push(`They run ${co.tech[0]} — reference an integration-friendly rollout.`);
    if (dm && dm.seniority === "C-Suite") a.push("Executive contact: lead with business outcome, not curriculum detail.");
    if (!a.length) a.push(`Anchor on the sector-wide pressure: ${(co.pains || ["AI readiness"])[0]}.`);
    return a;
  }

  // ===================================================== LOOKALIKES (spec §E)
  function lookalikes(co, limit) {
    const fp = { industry: co.industry, sub: co.sub, size: co.size, country: co.country, tech: new Set(co.tech.map((t) => t.toLowerCase())) };
    return D.companies.filter((x) => x.id !== co.id).map((x) => {
      let s = 0; const why = [];
      if (x.industry === fp.industry) { s += 34; why.push("same industry"); }
      if (x.sub === fp.sub) { s += 14; why.push("same segment"); }
      if (x.country === fp.country) { s += 10; why.push("same market"); }
      const techOverlap = x.tech.filter((t) => fp.tech.has(t.toLowerCase())).length;
      if (techOverlap) { s += techOverlap * 7; why.push(`${techOverlap} shared technolog${techOverlap === 1 ? "y" : "ies"}`); }
      const sizeCloseness = 1 - Math.min(1, Math.abs(x.size - fp.size) / Math.max(120, fp.size * 2));
      s += sizeCloseness * 16;
      if (sizeCloseness > 0.75) why.push("similar headcount");
      if (x.signals.length) s += 4;
      return Object.assign({}, x, { _score: Math.min(99, Math.round(40 + s)), _reason: why.join(" · ") || "loose profile similarity" });
    }).filter((x) => x._score >= 58).sort((a, b) => b._score - a._score).slice(0, limit || 25);
  }

  // ===================================================== SEGMENTS (spec §F)
  function segments(criteriaFilter) {
    const map = {};
    D.companies.forEach((co) => {
      const key = co.industry;
      const m = map[key] || (map[key] = { name: key, companies: 0, people: 0, verified: 0, signalRich: 0, sizes: [], countries: {} });
      m.companies++;
      const staff = D.peopleByCompany[co.id] || [];
      m.people += staff.length;
      m.verified += staff.filter((p) => p.verified).length;
      if (co.signals.length) m.signalRich++;
      m.sizes.push(co.size);
      m.countries[co.country] = (m.countries[co.country] || 0) + 1;
    });
    return Object.values(map).map((m) => {
      const icp = D.icps.find((i) => i.industry === m.name);
      m.avgSize = Math.round(m.sizes.reduce((a, b) => a + b, 0) / m.sizes.length);
      m.topCountry = Object.entries(m.countries).sort((a, b) => b[1] - a[1])[0][0];
      m.coverage = Math.round((m.verified / Math.max(1, m.people)) * 100);
      m.signalRate = Math.round((m.signalRich / m.companies) * 100);
      m.fit = icp ? icp.fit : Math.max(35, Math.min(80, 40 + m.signalRate / 2 + m.coverage / 4));
      m.icp = icp || null;
      return m;
    }).sort((a, b) => b.fit - a.fit);
  }

  // ===================================================== EMAIL GENERATION (spec §H)
  const TONES = {
    direct: { greet: (f) => `Hi ${f},`, close: "Worth a 15-minute call?", sign: "— Andre" },
    consultative: { greet: (f) => `Hi ${f},`, close: "If it's useful I can share how two comparable institutions approached it.", sign: "— Andre" },
    warm: { greet: (f) => `Hi ${f},`, close: "Happy to send over a short outline if that's helpful.", sign: "— Andre" },
    executive: { greet: (f) => `${f},`, close: "Open to a brief call to see whether it maps to your plan?", sign: "— Andre" },
  };

  function generateEmail(co, person, opts) {
    opts = opts || {};
    const tone = TONES[opts.tone || "consultative"];
    const first = person.name.split(" ")[0];
    const research = deepResearch(co, person);
    const trigger = co.signals[0];
    const pain = (co.pains || ["AI readiness"])[0];
    const goal = opts.goal || "book a short call";

    const opener = trigger
      ? `Saw ${co.name} ${trigger.toLowerCase()} — that usually means the AI question moves from "should we" to "how, and who owns it."`
      : `I work with ${co.industry.toLowerCase()} teams around your size on ${pain}.`;

    const middle = co.industry === "Higher Education"
      ? `Most institutions I work with have a policy statement but no faculty adoption path behind it. The gap shows up as inconsistent assessment rules and staff who quietly avoid the tools.`
      : co.industry === "EdTech"
      ? `The teams selling into institutions right now are losing cycles to procurement, not to competitors. Governance language in the deck is usually what unlocks it.`
      : `The pattern I keep seeing: leadership has an AI mandate, and the team underneath it has no shared standard for what "good" looks like.`;

    const proof = `I run readiness audits and faculty/staff training cohorts that produce something defensible to a board, not a slide deck.`;

    const subject = trigger
      ? `${co.name} + ${trigger.toLowerCase()}`
      : `${pain} at ${co.name}`;

    const body = [tone.greet(first), "", opener, "", middle, "", proof, "", tone.close, tone.sign].join("\n");

    return { subject, body, tone: opts.tone || "consultative", goal,
      personalization: research.angles.slice(0, 2),
      strength: trigger ? "High — anchored on a live trigger" : "Medium — sector-level personalization only" };
  }

  function followUp(co, person, step) {
    const first = person.name.split(" ")[0];
    const bodies = [
      `Hi ${first},\n\nBumping this once in case it slipped. The short version: I help ${co.industry.toLowerCase()} teams turn an AI mandate into something staff actually use.\n\nWorth 15 minutes?\n\n— Andre`,
      `Hi ${first},\n\nLast note from me. If the timing is wrong I'll close the loop.\n\nIf it's useful later, the readiness audit is the usual starting point — it produces a board-ready picture in about three weeks.\n\n— Andre`,
    ];
    return { subject: `Re: ${co.name}`, body: bodies[Math.min(step - 1, bodies.length - 1)] };
  }

  // ===================================================== REPLY INTENT (spec §8)
  const INTENTS = [
    { key: "Meeting Request", hot: true, color: "good", re: /\b(calendar|book|schedule|available|what times?|let'?s (?:talk|meet|chat)|send an invite|next week works)\b/i },
    { key: "Interested", hot: true, color: "good", re: /\b(interested|tell me more|sounds good|keen|would like to (?:hear|learn)|send (?:more|over))\b/i },
    { key: "Pricing", hot: true, color: "good", re: /\b(pricing|price|cost|how much|budget|rates?|quote|proposal)\b/i },
    { key: "Question", hot: false, color: "warn", re: /\b(how does|what does|can you|do you|question|clarify|curious (?:about|how))\b/i },
    { key: "Referral", hot: false, color: "warn", re: /\b(right person|colleague|introduce|forward(?:ed|ing)? (?:this|you)|reach out to|speak (?:with|to) [A-Z])\b/i },
    { key: "Not Now", hot: false, color: "warn", re: /\b(next (?:quarter|year|semester)|revisit|circle back|not (?:right )?now|later this year|after (?:the )?budget)\b/i },
    { key: "Objection", hot: false, color: "warn", re: /\b(already (?:have|working)|we use|in-house|not a (?:fit|priority)|too expensive|no budget)\b/i },
    { key: "Out of Office", hot: false, color: "muted", re: /\b(out of (?:the )?office|on leave|annual leave|vacation|away until|parental leave)\b/i },
    { key: "Wrong Person", hot: false, color: "muted", re: /\b(not (?:the right|who|my)|wrong person|don'?t handle|no longer with|left the (?:company|organization))\b/i },
    { key: "Unsubscribe", hot: false, color: "bad", re: /\b(unsubscribe|remove me|stop (?:emailing|contacting)|take me off|opt out|do not contact)\b/i },
    { key: "Negative", hot: false, color: "bad", re: /\b(not interested|no thanks|no thank you|pass\b|spam|stop)\b/i },
  ];

  function classifyReply(text) {
    const t = String(text || "");
    // Order matters: hard negatives and compliance intents win over soft positives.
    const compliance = INTENTS.filter((i) => i.color === "bad");
    for (const i of compliance) if (i.re.test(t)) return verdict(i, t);
    for (const i of INTENTS) if (i.re.test(t)) return verdict(i, t);
    return { intent: "Neutral", hot: false, color: "muted", confidence: 42,
      rationale: "No clear intent language detected. Routed for human review.", action: "Review manually" };
  }
  function verdict(i, t) {
    const hits = (t.match(i.re) || []).length;
    return {
      intent: i.key, hot: i.hot, color: i.color,
      confidence: Math.min(97, 68 + hits * 12 + Math.min(12, Math.floor(t.length / 40))),
      rationale: `Matched ${i.key.toLowerCase()} language in the reply body.`,
      action: i.key === "Meeting Request" ? "Propose times and create the meeting"
        : i.key === "Pricing" ? "Send scoped pricing, then propose a call"
        : i.key === "Interested" ? "Reply with a concrete next step"
        : i.key === "Referral" ? "Thank them and open a thread with the named person"
        : i.key === "Unsubscribe" ? "Suppress permanently — no further contact"
        : i.key === "Negative" ? "Suppress this contact and stop the sequence"
        : i.key === "Out of Office" ? "Snooze until the return date"
        : i.key === "Wrong Person" ? "Ask for the correct owner, suppress this contact"
        : i.key === "Not Now" ? "Schedule a nurture follow-up"
        : i.key === "Objection" ? "Human reply — address the objection directly"
        : "Answer the question, then propose a call",
      autoReplySafe: i.key === "Meeting Request" || i.key === "Interested" || i.key === "Out of Office",
    };
  }

  // ===================================================== ANALYTICS (spec §14)
  function analytics(ws) {
    const camps = ws.campaigns || [];
    const sum = (f) => camps.reduce((a, c) => a + (c[f] || 0), 0);
    const sent = sum("sent"), replies = sum("replies"), positive = sum("positive"),
      hot = sum("hot"), meetings = sum("meetings"), spend = sum("spend");
    const byCampaign = camps.map((c) => ({ name: c.name, leads: (c.leadIds || []).length, sent: c.sent, replies: c.replies, hot: c.hot, meetings: c.meetings, spend: c.spend,
      replyRate: c.sent ? +(c.replies / c.sent * 100).toFixed(1) : 0 }));
    const segs = segments();
    const best = byCampaign.slice().sort((a, b) => b.replyRate - a.replyRate)[0];
    const worst = byCampaign.filter((c) => c.sent > 0).sort((a, b) => a.replyRate - b.replyRate)[0];
    const insights = [];
    if (best && worst && best !== worst && worst.replyRate > 0) {
      const mult = (best.replyRate / Math.max(0.1, worst.replyRate)).toFixed(1);
      insights.push(`"${best.name}" is converting ${mult}x better than "${worst.name}". Shift volume toward it.`);
    }
    if (best) insights.push(`Best-performing ICP: ${best.name} at a ${best.replyRate}% reply rate.`);
    const verifiedShare = Math.round(D.people.filter((p) => p.verified).length / D.people.length * 100);
    insights.push(`${verifiedShare}% of contacts in your reachable set have verified email. Unverified sends are the largest bounce risk.`);
    if (meetings) insights.push(`Cost per meeting is $${(spend / meetings).toFixed(2)} across ${meetings} booked.`);
    return {
      sent, replies, positive, hot, meetings, spend,
      replyRate: sent ? +(replies / sent * 100).toFixed(1) : 0,
      positiveRate: replies ? +(positive / replies * 100).toFixed(1) : 0,
      costPerLead: replies ? +(spend / replies).toFixed(2) : 0,
      costPerMeeting: meetings ? +(spend / meetings).toFixed(2) : 0,
      byCampaign, segments: segs.slice(0, 6), insights,
    };
  }

  // ===================================================== HELPERS
  const _coIdx = {}; D.companies.forEach((c) => (_coIdx[c.id] = c));
  const _peIdx = {}; D.people.forEach((p) => (_peIdx[p.id] = p));
  function companyById(id) { return _coIdx[id]; }
  function personById(id) { return _peIdx[id]; }

  return { parseQuery, searchCompanies, searchPeople, scoreCompany, deepResearch, lookalikes,
    segments, generateEmail, followUp, classifyReply, analytics, companyById, personById, TONES, INTENTS };
})();

<script>
/* Dr. D Lead Engineering System — workspace seed.
 * Builds the "running sales department" demo state: campaigns, conversations,
 * replies, hot leads, meetings, suppression, usage and the agent activity feed.
 * Persisted to localStorage; DRD_WORKSPACE.reset() rebuilds from seed.
 */
window.DRD_WORKSPACE = (function () {
  "use strict";
  const D = window.DRD_DATA, E = window.DRD_ENGINE;
  const KEY = "drd_workspace_v1";
  // Bump SCHEMA whenever the stored shape gains a field the views require. A
  // saved workspace from an older build is then discarded and rebuilt instead
  // of being loaded half-formed, which is what blanked the page when
  // multi-brand support landed without a bump.
  const SCHEMA = 2;
  const DAY = 86400000;

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // Original reply bodies keyed by the intent they should classify as.
  const REPLY_BANK = [
    { t: "Thanks for reaching out. This is timely — our board asked for an AI plan last month and we have nothing formal. What does the audit actually involve?" },
    { t: "Interested. Can you send pricing for a faculty cohort of about 40 people?" },
    { t: "I'm not the right person for this. Reach out to our Director of Teaching and Learning, she owns this file." },
    { t: "Let's talk. I have Tuesday or Thursday afternoon open next week — what works on your end?" },
    { t: "We already have an internal working group on this. Not a priority for us right now." },
    { t: "Out of the office until the 14th with limited access to email. I'll respond when I'm back." },
    { t: "How does this differ from the generic AI training vendors that have been emailing us all year?" },
    { t: "Please remove me from your list and do not contact me again." },
    { t: "Not interested, thanks." },
    { t: "Circle back next quarter — our budget cycle restarts in April and I'd rather talk with real numbers." },
    { t: "This looks useful. What would a three-week engagement cost for a department of our size?" },
    { t: "Can you clarify whether this covers assessment policy or just tool training? That distinction matters for us." },
    { t: "Happy to book something. Send an invite for any morning that week." },
    { t: "We're mid-procurement on something similar. Worth a conversation anyway — what's your availability?" },
    { t: "Forwarding this to our AVP Innovation, he's leading the initiative." },
  ];

  // Every ICP across every brand, so a campaign can reference any of them.
  const ALL_ICPS = D.brands.reduce((a, b) => a.concat(b.icps), []);

  function build() {
    const rnd = mulberry32(777001);
    const pick = (a) => a[Math.floor(rnd() * a.length)];
    const now = Date.now();

    // ---- pick target companies per ICP -------------------------------
    const approved = D.icps.filter((i) => i.approved);
    const campaignDefs = [
      { name: "Ontario Colleges — Readiness Audit", icp: "icp_1", goal: "Book a 20-minute readiness call", tone: "consultative", status: "Active", budget: 900, autopilot: true },
      { name: "EdTech Partnerships — Q3", icp: "icp_2", goal: "Book a partnership intro", tone: "direct", status: "Active", budget: 600, autopilot: true },
      { name: "Enterprise L&D — AI Upskilling", icp: "icp_3", goal: "Book a scoping call", tone: "executive", status: "Active", budget: 750, autopilot: false },
      { name: "US Universities — Pilot Expansion", icp: "icp_1", goal: "Book a pilot conversation", tone: "consultative", status: "Paused", budget: 400, autopilot: false },
      { name: "Professional Services — Warm Test", icp: "icp_4", goal: "Gauge interest in partner training", tone: "warm", status: "Draft", budget: 250, autopilot: false },
      { name: "Youth Clubs — Site + Roster", brandId: "drdsports", icp: "sp_1", goal: "Book a 15-minute club walkthrough", tone: "direct", status: "Active", budget: 500, autopilot: true },
      { name: "Coaches — Single Team Pilot", brandId: "drdsports", icp: "sp_6", goal: "Start one team on a pilot", tone: "warm", status: "Active", budget: 300, autopilot: false },
      { name: "US High Schools — NIL Education", brandId: "drdsports", icp: "sp_3", goal: "Book an NIL briefing with the AD", tone: "consultative", status: "Draft", budget: 400, autopilot: false },
    ];

    const campaigns = [], conversations = [], meetings = [], activity = [];
    let convId = 1, meetId = 1;

    campaignDefs.forEach((def, ci) => {
      const icp = ALL_ICPS.find((i) => i.id === def.icp);
      const pool = D.companies.filter((c) => c.industry === icp.industry && (!icp.country || c.country === icp.country) && (!icp.sizeMin || c.size >= icp.sizeMin));
      const chosen = pool.slice(0, def.status === "Draft" ? 14 : def.status === "Paused" ? 18 : 26);
      const leadIds = [];
      chosen.forEach((co) => { (D.peopleByCompany[co.id] || []).slice(0, 2).forEach((p) => leadIds.push(p.id)); });

      const isLive = def.status !== "Draft";
      const sent = isLive ? Math.floor(leadIds.length * (def.status === "Active" ? 1.75 : 0.9)) : 0;
      const replies = isLive ? Math.max(2, Math.round(sent * (0.07 + rnd() * 0.09))) : 0;
      const positive = Math.max(1, Math.round(replies * (0.32 + rnd() * 0.25)));

      const camp = {
        id: "cmp_" + (ci + 1), brandId: def.brandId || "edvisingu",
        name: def.name, icpId: def.icp, goal: def.goal, tone: def.tone,
        status: def.status, autopilot: def.autopilot, budget: def.budget,
        spend: isLive ? +(sent * 0.031).toFixed(2) : 0,
        leadIds, sent, replies, positive, hot: 0, meetings: 0,
        createdAt: now - (30 - ci * 4) * DAY,
        sequence: [
          { step: 1, day: 0, label: "Personalized opener" },
          { step: 2, day: 3, label: "Follow-up — short bump" },
          { step: 3, day: 8, label: "Final note — close the loop" },
        ],
      };

      // ---- conversations for the replies -----------------------------
      const repliers = leadIds.slice(0, replies);
      repliers.forEach((pid, i) => {
        const p = E.personById(pid); if (!p) return;
        const co = E.companyById(p.companyId);
        const bank = REPLY_BANK[(ci * 5 + i) % REPLY_BANK.length];
        const cls = E.classifyReply(bank.t);
        const outbound = E.generateEmail(co, p, { tone: def.tone, goal: def.goal });
        const at = now - int(rnd, 1, 21) * DAY;
        const conv = {
          id: "cnv_" + convId++, brandId: camp.brandId, personId: pid, companyId: co.id, campaignId: camp.id,
          subject: outbound.subject,
          messages: [
            { dir: "out", text: outbound.body, at: at - 2 * DAY },
            { dir: "in", text: bank.t, at },
          ],
          intent: cls.intent, intentMeta: cls, hot: cls.hot,
          status: cls.hot ? "Need Reply" : (cls.intent === "Unsubscribe" || cls.intent === "Negative" ? "Closed" : "Need Reply"),
          starred: false, at,
        };
        if (cls.hot) camp.hot++;
        conversations.push(conv);

        // ---- meetings from meeting-intent replies --------------------
        if (cls.intent === "Meeting Request" || (cls.intent === "Interested" && rnd() > 0.55)) {
          meetings.push({
            id: "mtg_" + meetId++, brandId: camp.brandId, personId: pid, companyId: co.id, campaignId: camp.id,
            at: now + int(rnd, -6, 16) * DAY,
            duration: 30,
            status: rnd() > 0.75 ? "Completed" : "Confirmed",
            title: `${co.name} — AI readiness intro`,
          });
          camp.meetings++;
        }
      });
      campaigns.push(camp);
    });

    // Book meetings only where the reply actually justifies one. Roughly a third of
    // hot leads stay unbooked on purpose — that is the work the inbox exists to do.
    conversations.filter((c) => c.hot).forEach((c) => {
      if (meetings.some((m) => m.personId === c.personId)) return;
      if (rnd() > 0.62) return;
      meetings.push({ id: "mtg_" + meetId++, personId: c.personId, companyId: c.companyId, campaignId: c.campaignId,
        at: now + int(rnd, -4, 18) * DAY, duration: 30,
        status: pick(["Confirmed", "Confirmed", "Proposed"]),
        title: `${E.companyById(c.companyId).name} — AI readiness intro` });
      const camp = campaigns.find((x) => x.id === c.campaignId);
      if (camp) camp.meetings++;
    });

    // Historical pipeline: completed meetings from earlier outreach on accounts that
    // are not part of the current live threads, so analytics has real history.
    const contacted = new Set(conversations.map((c) => c.personId));
    for (const camp of campaigns) {
      for (const lid of camp.leadIds) {
        if (meetings.length >= 20) break;
        if (contacted.has(lid) || meetings.some((m) => m.personId === lid)) continue;
        if (rnd() > 0.25) continue;
        const p = E.personById(lid); if (!p) continue;
        meetings.push({ id: "mtg_" + meetId++, personId: lid, companyId: p.companyId, campaignId: camp.id,
          at: now - int(rnd, 3, 45) * DAY, duration: 30, status: "Completed",
          title: `${E.companyById(p.companyId).name} — AI readiness intro` });
        camp.meetings++;
      }
    }

    // ---- suppression -------------------------------------------------
    const suppressions = [];
    conversations.filter((c) => c.intent === "Unsubscribe" || c.intent === "Negative").forEach((c) => {
      const p = E.personById(c.personId);
      suppressions.push({ id: "sup_" + (suppressions.length + 1), type: "Person", value: p.email,
        reason: c.intent === "Unsubscribe" ? "Unsubscribe request" : "Explicit negative reply",
        scope: "Global", at: c.at });
    });
    suppressions.push({ id: "sup_x1", type: "Domain", value: "competitorgroup.com", reason: "Competitor — do not contact", scope: "Global", at: Date.now() - 40 * DAY });

    // ---- agent activity feed ----------------------------------------
    const feed = [
      { state: "OPTIMIZING", text: "Shifted 120 sends from “US Universities” to “Ontario Colleges” — 2.4x better reply rate.", at: now - 40 * 60000 },
      { state: "BOOKING", text: "Proposed three times to a hot lead at a Higher Education account.", at: now - 3 * 3600000 },
      { state: "QUALIFYING", text: "Classified 6 new replies. 2 hot, 1 referral, 1 unsubscribe suppressed.", at: now - 5 * 3600000 },
      { state: "SENDING", text: "Sent 84 personalized openers across 2 active campaigns.", at: now - 9 * 3600000 },
      { state: "WRITING", text: "Generated 84 emails anchored on live company triggers.", at: now - 11 * 3600000 },
      { state: "RESEARCHING", text: "Completed deep research on 31 priority accounts.", at: now - 26 * 3600000 },
      { state: "FINDING LEADS", text: "Added 52 companies and 118 decision-makers matching approved ICPs.", at: now - 30 * 3600000 },
      { state: "ANALYZING", text: "Refreshed ICP fit scores from the last 30 days of reply data.", at: now - 48 * 3600000 },
    ];

    return {
      version: SCHEMA,
      activeBrand: "drdverse",
      brands: JSON.parse(JSON.stringify(D.brands)),
      profile: D.businessProfile,
      icps: JSON.parse(JSON.stringify(D.icps)),
      campaigns, conversations, meetings, suppressions,
      activity: feed,
      savedSearches: [
        { id: "ss_1", name: "Ontario colleges 200+", query: "colleges in Ontario with more than 200 employees", kind: "companies" },
        { id: "ss_2", name: "EdTech heads of product", query: "heads of product at edtech companies", kind: "people" },
      ],
      lists: [],
      research: {},
      onboarded: true,
      autopilot: true,
      // Usage reflects the seeded activity: one credit per send, four per research report.
      credits: { plan: "Growth", included: 5000,
        used: campaigns.reduce((s, c) => s + c.sent, 0) + 31 * 4,
        emailRate: 0.031, researchRate: 0.12 },
      apiKeys: [{ id: "key_1", name: "Production", prefix: "drd_live_9f2c", created: Date.now() - 60 * DAY, lastUsed: Date.now() - 2 * DAY }],
      webhooks: [{ id: "wh_1", url: "https://edvisingu.app.n8n.cloud/webhook/drd-hot-lead", events: ["lead.hot", "meeting.booked"], active: true }],
      audit: [],
    };
  }
  function int(rnd, lo, hi) { return lo + Math.floor(rnd() * (hi - lo + 1)); }

  // ---- persistence ---------------------------------------------------
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const w = JSON.parse(raw);
        // Both guards matter: the version catches a known-old save, the shape
        // check catches one saved by a build that changed fields without a bump.
        if (w && w.version === SCHEMA && Array.isArray(w.brands) && w.brands.length) return w;
      }
    } catch (e) {}
    const w = build();
    save(w);
    return w;
  }
  function save(w) { try { localStorage.setItem(KEY, JSON.stringify(w)); } catch (e) {} }
  function reset() { try { localStorage.removeItem(KEY); } catch (e) {} return load(); }

  // ------------------------------------------------------------------
  // Backend mode. When the page is served by the API (config.js supplies a
  // token) the workspace is hydrated from the database instead of localStorage,
  // and mutations are written through to the server.
  // ------------------------------------------------------------------
  const hasApi = () => typeof window !== "undefined" && window.DRD_AUTH === "cookie";

  // The browser authenticates with an httpOnly session cookie set at login.
  // No API key ever reaches client-side JavaScript.
  async function api(method, path, body) {
    const res = await fetch((window.DRD_API_BASE || "") + path, {
      method,
      credentials: "same-origin",
      headers: { "content-type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    let json = null;
    try { json = await res.json(); } catch (e) {}
    if (!res.ok) {
      const err = new Error((json && json.error) || ("http_" + res.status));
      err.status = res.status; err.body = json; throw err;
    }
    return json;
  }

  async function hydrate() {
    const [projects, icps, campaigns, convos, meetings, sups, usage, audit, hooks] = await Promise.all([
      api("GET", "/v1/projects"), api("GET", "/v1/icps"), api("GET", "/v1/campaigns"),
      api("GET", "/v1/conversations"), api("GET", "/v1/meetings"), api("GET", "/v1/suppressions"),
      api("GET", "/v1/usage"), api("GET", "/v1/audit"), api("GET", "/v1/webhooks"),
    ]);

    // Lead ids per campaign, so the UI can list and count them.
    const leadSets = await Promise.all(campaigns.data.map((c) =>
      api("GET", "/v1/leads?campaign_id=" + encodeURIComponent(c.id)).then((r) => r.data.map((l) => l.contact_id))));

    const project = projects.data[0] || {};
    const u = usage.data;
    const seedLocal = build(); // reuse the presentational agent feed

    return {
      version: SCHEMA, backend: true,
      // The brand portfolio is configuration, not transactional data, so it
      // comes from the seed definitions in both modes. Without it every view
      // that scopes by brand throws on first render.
      activeBrand: "drdverse",
      brands: JSON.parse(JSON.stringify(D.brands)),
      profile: project.profile || seedLocal.profile,
      icps: icps.data,
      campaigns: campaigns.data.map((c, i) => ({
        id: c.id, name: c.name, icpId: c.icp_id, goal: c.goal, tone: c.tone, status: c.status,
        autopilot: c.autopilot, budget: c.budget, spend: c.spend, sent: c.sent, replies: c.replies,
        positive: c.positive, hot: c.hot, meetings: c.meetings, sequence: c.sequence,
        leadIds: leadSets[i] || [], createdAt: Date.now(),
      })),
      conversations: convos.data.map((c) => ({
        id: c.id, personId: c.contact.id, companyId: c.company.id, campaignId: c.campaign_id,
        subject: c.subject, status: c.status, intent: c.intent || "Neutral",
        intentMeta: Object.assign({ confidence: c.confidence || 0, color: "muted", action: "Review manually", rationale: "" }, c.intent_meta || {}),
        hot: !!c.hot, at: c.last_at, preview: c.preview || "", messages: null, // fetched on open
      })),
      meetings: meetings.data.map((m) => ({
        id: m.id, personId: m.contact.id, companyId: m.company.id, campaignId: m.campaign_id,
        at: m.at, duration: m.duration, status: m.status, title: m.title,
      })),
      suppressions: sups.data.map((s) => ({ id: s.id, type: s.type, value: s.value, reason: s.reason, scope: s.scope, at: s.created_at })),
      activity: seedLocal.activity,
      savedSearches: seedLocal.savedSearches,
      lists: [], research: {},
      onboarded: true,
      autopilot: !!u.autopilot,
      credits: { plan: u.plan, included: u.credits_included, used: u.credits_used, emailRate: 0.031, researchRate: 0.12 },
      apiKeys: seedLocal.apiKeys,
      webhooks: hooks.data,
      audit: audit.data.map((a) => ({ at: a.at, action: a.action, detail: a.detail })),
    };
  }

  // Write-through helpers. Each mirrors a local mutation to the server; the UI
  // already updated optimistically, so a failure surfaces as a toast, not a stall.
  const push = {
    icp: (id, approved) => api("PATCH", "/v1/icps/" + id, { approved }),
    autopilot: (on) => api("PATCH", "/v1/autopilot", { autopilot: on }),
    campaignStatus: (id, status) => api("POST", "/v1/campaigns/" + id + "/" + (status === "Active" ? "start" : "pause")),
    createCampaign: (b) => api("POST", "/v1/campaigns", b),
    addSuppression: (value, reason) => api("POST", "/v1/suppressions", { value, reason }),
    removeSuppression: (id) => api("DELETE", "/v1/suppressions/" + id),
    bookMeeting: (contactId, campaignId) => api("POST", "/v1/meetings", { contact_id: contactId, campaign_id: campaignId }),
    reply: (convId, body) => api("POST", "/v1/conversations/" + convId + "/reply", { body }),
    conversation: (id) => api("GET", "/v1/conversations/" + id),
    research: (companyId) => api("POST", "/v1/research", { company_id: companyId }),
  };

  const auth = {
    me: () => api("GET", "/v1/auth/me"),
    login: (password) => api("POST", "/v1/auth/login", { password }),
    logout: () => api("POST", "/v1/auth/logout"),
  };

  return { load, save, reset, build, hasApi, hydrate, api, push, auth };
})();

<script>
/* Dr. D Lead Engineering System — application layer.
 * Router, all module views, drawers, and persistence wiring.
 */
(function () {
  "use strict";
  const D = window.DRD_DATA, E = window.DRD_ENGINE, WS = window.DRD_WORKSPACE;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  let ws = WS.load();
  const state = {
    view: "overview",
    company: { query: "", results: null, criteria: null, sel: new Set(), sort: "score" },
    person: { query: "", results: null, criteria: null, sel: new Set() },
    inbox: { filter: "Need Reply", active: null },
    campaign: null,
    agentBusy: false,
  };

  // ---------------------------------------------------------------- utils
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  const money = (n) => "$" + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const num = (n) => Number(n || 0).toLocaleString();
  const initials = (n) => String(n).split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
  function ago(ts) {
    const d = Date.now() - ts, m = Math.round(d / 60000);
    if (m < 60) return m + "m ago";
    const h = Math.round(m / 60); if (h < 24) return h + "h ago";
    const dd = Math.round(h / 24); return dd + "d ago";
  }
  function dateStr(ts) { return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); }
  function timeStr(ts) { return new Date(ts).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
  function save() { if (!ws.backend) WS.save(ws); }

  // Mirror a local mutation to the server. The UI already updated optimistically,
  // so a failure surfaces as a toast rather than blocking the interaction.
  function wt(fn) {
    if (!ws.backend || !fn) return;
    try {
      const p = fn();
      if (p && p.catch) p.catch(function (e) { toast("Server rejected: " + (e.message || "error")); });
    } catch (e) { toast("Server error: " + e.message); }
  }
  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.innerHTML = '<span class="d"></span>' + esc(msg);
    $("#toasts").appendChild(t);
    setTimeout(() => { t.style.opacity = "0"; t.style.transition = "0.3s"; setTimeout(() => t.remove(), 320); }, 2800);
  }
  function audit(action, detail) {
    ws.audit.unshift({ at: Date.now(), action, detail });
    ws.audit = ws.audit.slice(0, 200); save();
  }
  function scoreCls(n) { return n >= 82 ? "hi" : n >= 62 ? "mid" : "lo"; }

  // ---- icons -------------------------------------------------------------
  // A single stroke set, drawn at one weight, instead of glyphs or emoji.
  const PATHS = {
    refresh: '<path d="M20 11a8 8 0 0 0-13.7-5.3L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 13.7 5.3L20 16"/><path d="M20 20v-4h-4"/>',
    send: '<path d="M4 12l16-8-7 16-2-6z"/>',

  // definitions rather than throw, because this runs before the first paint of
  // every view and an exception here blanks the whole page.
  function brandList() {
    if (ws && Array.isArray(ws.brands) && ws.brands.length) return ws.brands;
    return (window.DRD_DATA && window.DRD_DATA.brands) || [];

    const list = brandList();

  function bIcps() { return brand().icps || []; }

  const inBrand = (x) => isRollup() || x.brandId === ws.activeBrand;
  function camps() { return ws.campaigns.filter(inBrand); }

  // CSV export — uses the hosted downloads capability, falls back to a blob.
  async function exportCSV(filename, rows) {
    const csv = rows.map((r) => r.map((v) => {
      const s = String(v == null ? "" : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(",")).join("\n");
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
    if (dl) {
      try { await dl.save({ filename, data: csv }); toast("Exported " + (rows.length - 1) + " rows"); }
      catch (e) {
        if (e && e.code === "extension_not_enabled") {
          try { await dl.save({ filename: filename.replace(/\.csv$/, ".txt"), data: csv }); toast("Exported"); }
          catch (e2) { if (!e2 || e2.code !== "declined") toast("Export unavailable in this view"); }
        } else if (!e || e.code !== "declined") toast("Export unavailable in this view");
      }
      return;
    }
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 800);
    toast("Exported " + (rows.length - 1) + " rows");
  }

  /* The state of the system, said plainly on every screen.

   * Two things an operator must never misread: that generated sample contacts
   * are real pipeline, and that a configured campaign is actually delivering.
   * Both are shown as a banner rather than buried in a settings page, because
   * every number on every other screen means something different depending on

  function modeBanner(view) {
    const g = ws.golive;
    const demo = (g && g.coverage && g.coverage.demoContacts) || 0;
    const live = WS.hasApi();
    const parts = [];

    if (demo > 0) {
      parts.push(
        '<div class="banner bad"><span class="pill bad">SAMPLE DATA</span>' +
        "<span><b>" + num(demo) + " generated contacts</b> are in this database. They can never be " +
        "emailed, but every count and chart here includes them. Purge before trusting a number.</span>" +
        '<span class="grow"></span><button class="btn ghost sm" data-banner="golive">Go live</button></div>'
      );
    }
    if (live && g && !g.armed) {
      parts.push(
        '<div class="banner gold"><span class="pill gold">DISARMED</span>' +
        "<span>Nothing is being delivered. Campaigns will queue and skip every send until sending is " +
        "armed on the Go live screen.</span>" +
        '<span class="grow"></span><button class="btn ghost sm" data-banner="golive">Open the gate</button></div>'
      );
    }
    // The Go live screen explains the no-backend case in full, so the short
    // banner would just repeat it.
    if (!live && view !== "golive") {
      parts.push(
        '<div class="banner muted"><span class="pill muted">LOCAL DEMO</span>' +
        "<span>No backend is connected, so this is a sample dataset in your browser. Nothing can send " +
        "and nothing is stored on a server.</span></div>"

    return parts.join("");
  }

  // Everything that decides whether this system may contact a real person.
  // It was all reachable by API and invisible in the app, which is the same as
  // not existing: an operator cannot act on a gate they cannot see.
  VIEWS.golive = function () {
    const g = ws.golive || null;
    const cov = (g && g.coverage) || {};
    const checks = (g && g.checks) || [];
    const blocking = checks.filter((c) => c.blocking);
    const advisory = checks.filter((c) => !c.blocking);
    const armed = g && g.armed;

    // Without a backend there is nothing to check, and spinning forever is
    // worse than saying so. Explain what the gate does and what it needs.
    if (!WS.hasApi()) {
      const items = [
        ["No generated sample contacts present", "Fiction in the database makes every figure meaningless."],
        ["At least one real contact, imported with provenance", "Consent cannot be reconstructed after the fact."],
        ["Every contact has a live consent basis", "Scoped per brand, with its own expiry clock."],
        ["Sender identification set", "Legal name, mailing address and contact details in every message."],
        ["An active mailbox with a valid timezone", "Daily caps reset on the mailbox's own clock."],
        ["No open critical alerts", "A paused mailbox or missing identification blocks arming."],
        ["A reachable unsubscribe URL", "The opt-out link has to actually work."],
        ["SPF and DMARC present on every sending domain", "Unverifiable counts as not ready, not as fine."],
        ["A clearance record on file", "Who authorised activation, and when."],
      ];
      return '<div class="page-head"><div><h2>Go live</h2>' +
        "<p>The gate that decides whether this system may contact a real person. It runs against the " +
        "backend, so it is unavailable in this browser-only build.</p></div></div>" +
        '<div class="banner muted"><span class="pill muted">BACKEND REQUIRED</span>' +
        "<span>This build has no server, so there is nothing to arm and nothing that can send. " +
        "Run the API locally and the checks below become live.</span></div>" +
        '<div class="card"><div class="card-h"><h3>What must pass before sending is armed</h3>' +
          '<span class="grow"></span><span style="font-size:11px;color:var(--faint)">' +
          items.length + " blocking checks</span></div>" +
          '<div class="card-b"><div class="stack">' +
          items.map((it, i) =>
            '<div class="rowflex" style="align-items:flex-start;gap:10px">' +
            '<span class="pill muted" style="margin-top:1px">' + (i + 1) + "</span>" +
            '<div class="grow"><div class="prime">' + esc(it[0]) + "</div>" +
            '<div class="sub" style="margin-top:2px">' + esc(it[1]) + "</div></div></div>").join("") +
          "</div>" +
          '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border-soft);' +
            'font-size:12px;color:var(--muted);line-height:1.6;max-width:74ch">' +
            "<b>A passing gate is not a legal opinion.</b> It means the system is configured correctly. " +
            "Qualified Canadian legal review of the consent basis for a list is required before sending. " +
            "See docs/GO-LIVE.md and docs/COMPLIANCE.md in the repository." +
          "</div></div></div>";
    }

    if (!g) {
      return '<div class="page-head"><div><h2>Go live</h2>' +
        "<p>The gate that decides whether this system may contact a real person.</p></div></div>" +
        '<div class="card pad"><div class="loading"><div class="spin"></div>' +

  WIRE.golive = function () {
    const refresh = async () => {
      if (!WS.hasApi()) return;
      try {
        const [rd, al, jb] = await Promise.all([
          WS.api("GET", "/v1/readiness"),
          WS.api("GET", "/v1/alerts"),
          WS.api("GET", "/v1/jobs"),
        ]);
        ws.golive = rd;
        ws.alerts = (al && al.data) || [];
        ws.jobs = (jb && jb.stats) || {};
        go("golive");
      } catch (e) { toast("Could not load readiness: " + e.message); }
    };
    if (!ws.golive && WS.hasApi()) refresh();

    $$("[data-act]").forEach((b) => b.addEventListener("click", async () => {
      const act = b.dataset.act;
      if (act === "gl-refresh") return refresh();
      if (act === "gl-arm" || act === "gl-disarm") {
        const arming = act === "gl-arm";
        try {
          const r = await WS.api("POST", "/v1/readiness/arm", { armed: arming });
          toast(r.armed ? "Sending armed" : "Sending disarmed");
          refresh();
        } catch (e) {
          toast(arming ? "Refused: readiness checks still failing" : "Could not disarm");
          refresh();
        }
        return;
      }
      if (act === "imp-template") {
        try {
          const t = await WS.api("GET", "/v1/import/template");
          const el = $("#imp-csv");
          if (el) el.value = t.csv || "";
          toast("Template loaded. Replace the example row.");
        } catch (e) { toast("Could not load the template"); }
        return;
      }
      if (act === "imp-run") {
        const csv = ($("#imp-csv") || {}).value || "";
        if (!csv.trim()) return toast("Paste some CSV first");
        const out = $("#imp-out");
        if (out) out.innerHTML = '<div class="loading"><div class="spin"></div>Importing</div>';
        try {
          // Remembered in state: a repaint recreates the control, and losing the
          // operator's choice on every action is its own small bug.
          ws.impSkipMx = !!(($("#imp-skipmx") || {}).checked);
          const r = await WS.api("POST", "/v1/import", { csv, skip_mx: ws.impSkipMx });
          // Held in state: refresh() repaints the whole view, and an earlier
          // version wrote the report straight into the DOM, so the repaint
          // destroyed the one thing the operator needed to read.
          ws.lastImport = r;
          refresh();
        } catch (e) {
          // The API attaches the parsed body to the error. Showing only
          // e.message loses the part that says what to fix.
          if (e.body) { ws.lastImport = e.body; go("golive"); }
          else if (out) out.innerHTML = '<div class="login-err">' + esc(e.message) + "</div>";
        }
        return;
      }
      if (act === "imp-purge") {
        toast("Run `node server/purge-demo.js` on the server. Not exposed over the API on purpose.");
        return;
      }
    }));

    $$("[data-ack]").forEach((b) => b.addEventListener("click", async () => {
      try {
        await WS.api("POST", "/v1/alerts/" + b.dataset.ack + "/ack");
        refresh();
      } catch (e) { toast("Could not acknowledge"); }
    }));
  };
