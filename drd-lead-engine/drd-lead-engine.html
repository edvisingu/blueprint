<title>Dr. D Lead Engineering System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
/* Dr. D Lead Engineering System — "Refined Authority" command centre.
 * Brand-locked: Montserrat only, Navy #0A1628, Gold #C9A84C.
 * Deliberate single-theme dark navy per the EdVisingU brand system; every
 * colour is painted explicitly so the page holds on any host background.
 */

:root {
  --navy-900: #0A1628;
  --navy-850: #0C1B30;
  --navy-800: #0E1D33;
  --navy-750: #14243B;
  --navy-700: #1A2A42;
  --navy-600: #243652;
  --border: #1E3049;
  --border-soft: #172942;

  --gold: #C9A84C;
  --gold-bright: #E0C476;
  --gold-dim: rgba(201, 168, 76, 0.14);
  --gold-line: rgba(201, 168, 76, 0.34);

  --white: #FFFFFF;
  --muted: #8A94A6;
  --faint: #5F6B80;

  --good: #3FB984;
  --good-dim: rgba(63, 185, 132, 0.13);
  --warn: #E8964A;
  --warn-dim: rgba(232, 150, 74, 0.13);
  --bad: #E5566D;
  --bad-dim: rgba(229, 86, 109, 0.13);

  --r: 12px;
  --r-lg: 16px;
  --shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
  --font: 'Montserrat', -apple-system, 'Segoe UI', sans-serif;
  --sidebar-w: 236px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--navy-900);
  color: var(--white);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font-family: inherit; }
button { cursor: pointer; }
::selection { background: var(--gold-dim); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

.label {
  font-size: 10.5px; font-weight: 500; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--faint);
}
.num { font-variant-numeric: tabular-nums; }

/* ============================================================ SHELL */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

.sidebar {
  background: var(--navy-850);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { padding: 20px 18px 16px; border-bottom: 1px solid var(--border); }
.brand .mark {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 15px; letter-spacing: -0.01em; line-height: 1.2;
}
.brand .mono {
  width: 30px; height: 30px; flex: none; border-radius: 8px;
  background: linear-gradient(140deg, var(--gold), #A98A34);
  color: var(--navy-900); display: grid; place-items: center;
  font-weight: 800; font-size: 13px;
}
.brand .sub { font-size: 10.5px; color: var(--faint); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 8px; }

.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav .group { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); padding: 14px 10px 6px; font-weight: 600; }
.nav button {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: none; border: none; color: var(--muted);
  padding: 9px 10px; border-radius: 9px; font-size: 13.5px; font-weight: 500; text-align: left;
  transition: background 0.12s, color 0.12s;
}
.nav button:hover { background: var(--navy-750); color: var(--white); }
.nav button.on { background: var(--navy-700); color: var(--white); font-weight: 600; box-shadow: inset 2px 0 0 var(--gold); }
.nav button .ic { width: 16px; text-align: center; font-size: 13px; opacity: 0.9; }
.nav button .badge {
  margin-left: auto; background: var(--gold); color: var(--navy-900);
  font-size: 10.5px; font-weight: 700; border-radius: 20px; padding: 1px 7px; min-width: 20px; text-align: center;
}
.nav button .badge.quiet { background: var(--navy-600); color: var(--muted); }

.side-foot { padding: 14px; border-top: 1px solid var(--border); }
.plan { background: var(--navy-800); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; }
.plan .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.plan .bar { height: 5px; background: var(--navy-600); border-radius: 4px; margin: 8px 0 6px; overflow: hidden; }
.plan .bar i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }

/* ============================================================ MAIN */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 60px; flex: none; display: flex; align-items: center; gap: 14px;
  padding: 0 26px; border-bottom: 1px solid var(--border);
  background: var(--navy-850); position: sticky; top: 0; z-index: 30;
}
.topbar h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.topbar .crumb { font-size: 12px; color: var(--faint); }
.grow { flex: 1; }
.agent-pill {
  display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted);
  background: var(--navy-800); border: 1px solid var(--border); border-radius: 20px; padding: 6px 13px;
}
.agent-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); animation: pulse 2.4s ease-in-out infinite; }
.agent-pill.off .dot { background: var(--faint); animation: none; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
.who { width: 32px; height: 32px; border-radius: 50%; background: var(--navy-600); display: grid; place-items: center; font-size: 12px; font-weight: 700; }

.page { padding: 26px; max-width: 1400px; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
.page-head p { color: var(--muted); font-size: 13px; margin-top: 4px; max-width: 62ch; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ============================================================ ATOMS */
.btn {
  background: var(--gold); color: var(--navy-900); border: 1px solid var(--gold);
  border-radius: 9px; padding: 9px 16px; font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 7px; transition: filter 0.12s, transform 0.08s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--navy-700); color: var(--white); border-color: var(--border); }
.btn.ghost:hover { border-color: var(--gold-line); background: var(--navy-600); }
.btn.sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
.btn.danger { background: transparent; color: var(--bad); border-color: rgba(229, 86, 109, 0.4); }
.btn.danger:hover { background: var(--bad-dim); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }

.card { background: var(--navy-800); border: 1px solid var(--border); border-radius: var(--r-lg); }
.card.pad { padding: 18px; }
.card-h { padding: 15px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.card-h h3 { font-size: 13.5px; font-weight: 700; }
.card-b { padding: 18px; }

.input, .select, .ta {
  width: 100%; background: var(--navy-900); border: 1px solid var(--border);
  color: var(--white); border-radius: 9px; padding: 10px 12px; font-size: 13px; outline: none;
}
.input:focus, .select:focus, .ta:focus { border-color: var(--gold-line); }
.input::placeholder, .ta::placeholder { color: var(--faint); }
.ta { min-height: 120px; resize: vertical; line-height: 1.6; }
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; border-radius: 20px; padding: 3px 9px; white-space: nowrap; }
.pill.gold { background: var(--gold-dim); color: var(--gold-bright); }
.pill.good { background: var(--good-dim); color: var(--good); }
.pill.warn { background: var(--warn-dim); color: var(--warn); }
.pill.bad { background: var(--bad-dim); color: var(--bad); }
.pill.muted { background: var(--navy-700); color: var(--muted); }

.chip {
  font-size: 11.5px; color: var(--muted); background: var(--navy-750);
  border: 1px solid var(--border); border-radius: 7px; padding: 3px 8px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.score { display: inline-flex; align-items: baseline; gap: 3px; font-weight: 800; font-variant-numeric: tabular-nums; }
.score b { font-size: 17px; }
.score span { font-size: 10.5px; color: var(--faint); font-weight: 600; }
.score.hi b { color: var(--gold-bright); }
.score.mid b { color: var(--white); }
.score.lo b { color: var(--muted); }

/* stat tiles */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--navy-800); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; }
.stat .k { font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.stat .v { font-size: 25px; font-weight: 800; margin-top: 6px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat .d { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.stat.accent { border-color: var(--gold-line); background: linear-gradient(160deg, rgba(201,168,76,0.09), var(--navy-800) 60%); }
.stat.accent .v { color: var(--gold-bright); }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--navy-800); }
table.tbl { width: 100%; border-collapse: collapse; min-width: 720px; }
table.tbl th {
  text-align: left; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--faint); font-weight: 600; padding: 12px 14px; border-bottom: 1px solid var(--border);
  background: var(--navy-850); position: sticky; top: 0; white-space: nowrap;
}
table.tbl td { padding: 12px 14px; border-bottom: 1px solid var(--border-soft); font-size: 13px; color: var(--muted); vertical-align: middle; }
table.tbl tr:last-child td { border-bottom: none; }
table.tbl tbody tr { cursor: pointer; }
table.tbl tbody tr:hover td { background: var(--navy-750); }
table.tbl .prime { color: var(--white); font-weight: 600; }
table.tbl .sub { font-size: 11.5px; color: var(--faint); }
td.right, th.right { text-align: right; }

.checkbox { width: 15px; height: 15px; accent-color: var(--gold); cursor: pointer; }

/* layout helpers */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.split { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; align-items: start; }
.rowflex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* search bar */
.searchbar {
  display: flex; align-items: center; gap: 10px; background: var(--navy-800);
  border: 1px solid var(--border); border-radius: 12px; padding: 6px 6px 6px 14px; margin-bottom: 14px;
}
.searchbar:focus-within { border-color: var(--gold-line); }
.searchbar input { flex: 1; background: none; border: none; outline: none; color: var(--white); font-size: 14px; padding: 10px 0; }
.searchbar input::placeholder { color: var(--faint); }
.searchbar .ic { color: var(--faint); }
.examples { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
.examples button {
  font-size: 12px; color: var(--muted); background: var(--navy-800);
  border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px;
}
.examples button:hover { color: var(--white); border-color: var(--gold-line); }

.criteria { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; align-items: center; }
.crit {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px;
  background: var(--gold-dim); border: 1px solid var(--gold-line); color: var(--gold-bright);
  border-radius: 20px; padding: 4px 11px;
}
.crit i { font-style: normal; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }

/* score breakdown bars */
.bd { display: flex; flex-direction: column; gap: 9px; }
.bd .r { display: grid; grid-template-columns: 132px 1fr 38px; gap: 10px; align-items: center; font-size: 12px; }
.bd .r .n { color: var(--muted); }
.bd .r .t { height: 6px; background: var(--navy-600); border-radius: 4px; overflow: hidden; }
.bd .r .t i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
.bd .r .v { text-align: right; color: var(--white); font-weight: 600; font-variant-numeric: tabular-nums; }

/* bar chart */
.bars { display: flex; flex-direction: column; gap: 11px; }
.bars .b { display: grid; grid-template-columns: 1fr 42px; gap: 12px; align-items: center; }
.bars .b .lbl { font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
.bars .b .track { height: 8px; background: var(--navy-600); border-radius: 5px; overflow: hidden; }
.bars .b .track i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-bright)); border-radius: 5px; }
.bars .b .val { text-align: right; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* activity feed */
.feed { display: flex; flex-direction: column; }
.feed .it { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border-soft); }
.feed .it:last-child { border-bottom: none; }
.feed .st { font-size: 9.5px; letter-spacing: 0.07em; font-weight: 700; color: var(--gold-bright); background: var(--gold-dim); border-radius: 5px; padding: 3px 6px; text-align: center; height: fit-content; }
.feed .tx { font-size: 12.5px; color: var(--muted); }
.feed .tm { font-size: 11px; color: var(--faint); margin-top: 2px; }

/* inbox */
.inbox { display: grid; grid-template-columns: 330px 1fr; gap: 0; border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; min-height: 560px; background: var(--navy-800); }
.thread-list { border-right: 1px solid var(--border); overflow-y: auto; max-height: 74vh; }
.thread {
  padding: 13px 15px; border-bottom: 1px solid var(--border-soft); cursor: pointer;
}
.thread:hover { background: var(--navy-750); }
.thread.on { background: var(--navy-700); box-shadow: inset 2px 0 0 var(--gold); }
.thread .t1 { display: flex; align-items: center; gap: 8px; }
.thread .nm { font-size: 13px; font-weight: 600; color: var(--white); }
.thread .co { font-size: 11.5px; color: var(--faint); }
.thread .pv { font-size: 12px; color: var(--muted); margin-top: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.thread-view { padding: 20px; overflow-y: auto; max-height: 74vh; }
.msg { border: 1px solid var(--border); border-radius: var(--r); padding: 14px; margin-bottom: 12px; background: var(--navy-850); }
.msg.in { border-color: var(--gold-line); background: linear-gradient(160deg, rgba(201,168,76,0.06), var(--navy-850) 70%); }
.msg .mh { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.msg .mh .who2 { font-size: 12px; font-weight: 600; }
.msg .mh .when { font-size: 11px; color: var(--faint); margin-left: auto; }
.msg pre { font-family: var(--font); font-size: 13px; color: var(--muted); white-space: pre-wrap; line-height: 1.65; }

/* modal / drawer */
.veil { position: fixed; inset: 0; background: rgba(4, 9, 18, 0.72); display: none; z-index: 60; }
.veil.on { display: block; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100vh; width: min(680px, 100vw);
  background: var(--navy-850); border-left: 1px solid var(--border);
  z-index: 61; transform: translateX(100%); transition: transform 0.22s ease;
  display: flex; flex-direction: column; box-shadow: var(--shadow);
}
.drawer.on { transform: none; }
.drawer-h { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 12px; flex: none; }
.drawer-h h3 { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
.drawer-h .sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.drawer-h .x { margin-left: auto; background: none; border: none; color: var(--faint); font-size: 22px; line-height: 1; }
.drawer-h .x:hover { color: var(--white); }
.drawer-b { padding: 20px 22px; overflow-y: auto; flex: 1; }
.drawer-f { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; flex: none; }

.sec { margin-bottom: 22px; }
.sec > .label { margin-bottom: 10px; display: block; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
.kv .k { font-size: 10.5px; color: var(--faint); letter-spacing: 0.07em; text-transform: uppercase; }
.kv .v { font-size: 13.5px; color: var(--white); margin-top: 2px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.tabs button { background: none; border: none; color: var(--muted); padding: 9px 14px; font-size: 13px; font-weight: 500; border-bottom: 2px solid transparent; }
.tabs button:hover { color: var(--white); }
.tabs button.on { color: var(--white); border-bottom-color: var(--gold); font-weight: 600; }

/* onboarding */
.wiz { max-width: 720px; margin: 0 auto; padding: 40px 24px 80px; }
.wiz-steps { display: flex; gap: 6px; margin-bottom: 28px; }
.wiz-steps i { flex: 1; height: 3px; border-radius: 3px; background: var(--navy-600); }
.wiz-steps i.on { background: var(--gold); }
.wiz h2 { font-size: 27px; font-weight: 800; letter-spacing: -0.025em; text-wrap: balance; }
.wiz p.lede { color: var(--muted); font-size: 14.5px; margin-top: 10px; max-width: 60ch; }
.wiz .panel { margin-top: 26px; }

.icp-card { border: 1px solid var(--border); background: var(--navy-800); border-radius: var(--r); padding: 15px; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: start; }
.icp-card.on { border-color: var(--gold-line); background: linear-gradient(150deg, rgba(201,168,76,0.07), var(--navy-800) 65%); }
.icp-card h4 { font-size: 14.5px; font-weight: 700; }
.icp-card .why { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.55; }

/* misc */
.empty { text-align: center; padding: 64px 20px; color: var(--muted); }
.empty .big { font-size: 34px; margin-bottom: 10px; opacity: 0.75; }
.empty b { display: block; color: var(--white); font-size: 15px; margin-bottom: 6px; }
.loading { text-align: center; padding: 60px 0; color: var(--muted); font-size: 13px; }
.spin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--navy-600); border-top-color: var(--gold); margin: 0 auto 14px; animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

.toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: var(--navy-700); border: 1px solid var(--gold-line); color: var(--white);
  padding: 10px 17px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 8px; animation: rise 0.2s ease;
}
.toast .d { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

code.k { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--navy-900); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; color: var(--gold-bright); }
pre.code { background: var(--navy-900); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; overflow-x: auto; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); line-height: 1.65; }

.toggle { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: 13px; }
.toggle input { display: none; }
.toggle .tr { width: 38px; height: 21px; border-radius: 20px; background: var(--navy-600); position: relative; transition: background 0.15s; flex: none; }
.toggle .tr::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--muted); transition: 0.15s; }
.toggle input:checked + .tr { background: var(--gold); }
.toggle input:checked + .tr::after { left: 20px; background: var(--navy-900); }

@media (max-width: 1080px) {
  .split, .grid2, .grid3 { grid-template-columns: 1fr; }
  .inbox { grid-template-columns: 1fr; }
  .thread-list { max-height: 300px; border-right: none; border-bottom: 1px solid var(--border); }
}
@media (max-width: 780px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; flex-direction: row; overflow-x: auto; align-items: center; }
  .brand, .side-foot { display: none; }
  .nav { flex-direction: row; padding: 8px; }
  .nav .group { display: none; }
  .nav button { white-space: nowrap; }
  .page { padding: 18px 14px; }
}

</style>
<div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark"><span class="mono">DD</span> Dr.&nbsp;D Lead<br />Engineering System</div>
        <div class="sub">Autonomous GTM</div>

/* Dr. D Lead Engineering System — seed data layer.
 * Deterministic generator: same seed => same dataset every load, so demos are stable.
 * This stands in for the licensed B2B graph (companies/people). Swap DRD.db for a
 * real provider response of the same shape and every module keeps working.
 */
window.DRD_DATA = (function () {
  "use strict";

  // --- deterministic RNG -------------------------------------------------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(20260828);
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const pickN = (a, n) => { const c = a.slice(); const o = []; while (o.length < n && c.length) o.push(c.splice(Math.floor(rnd() * c.length), 1)[0]); return o; };
  const int = (lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1));

  // --- vocabulary --------------------------------------------------------
  const VERTICALS = [

  const weighted = (arr, keyFn, table) => {

  const V_BAG = weighted(VERTICALS, (v) => v.industry, V_WEIGHT);

  const businessProfile = {

  const icps = [

window.DRD_ENGINE = (function () {

  const TECH_WORDS = ["hubspot", "salesforce", "canvas lms", "canvas", "banner", "slate crm", "slate", "aws", "stripe", "snowflake", "segment", "react", "workday", "docebo", "okta", "zoom", "webflow", "figma", "plaid", "epic", "twilio", "qualtrics", "articulate"];
  const SIGNAL_PATTERNS = [
    { re: /hir(?:ing|ed) (?:sales|revenue|gtm)/i, signal: "Hiring sales leaders" },
    { re: /recently funded|raised|funding/i, signal: "Recently funded" },
    { re: /new (?:executive|exec|leader|hire)/i, signal: "New executive hire" },
    { re: /expand(?:ing|ed)?/i, signal: "Expanding to new region" },
    { re: /ai roles?|ai hiring|hiring ai/i, signal: "Job posts for AI roles" },
    { re: /ai policy/i, signal: "Published AI policy" },
    { re: /new program|launched/i, signal: "Launched new program" },
  ];
  const SENIORITY_WORDS = { "c-suite": "C-Suite", "ceo": "C-Suite", "cto": "C-Suite", "cfo": "C-Suite", "chief": "C-Suite", "founder": "C-Suite", "executive": "C-Suite", "vp": "VP", "vice president": "VP", "head of": "Head", "director": "Director", "dean": "Director", "manager": "Manager" };
  const DEPT_WORDS = { "sales": "Sales", "marketing": "Marketing", "product": "Product & Eng", "engineering": "Product & Eng", "l&d": "People & L&D", "hr": "People & L&D", "people": "People & L&D", "academic": "Academic", "teaching": "Academic" };

  const STOP = new Set(["find","show","me","get","all","the","a","an","and","or","of","with","that","who","are","is","in","at","to","for","from","under","over","between","less","than","more","fewer","companies","company","people","person","organizations","employees","staff","using","use","uses","have","has","recently","their","its"]);

  function parseQuery(q) {
    const t = " " + String(q).toLowerCase().replace(/[^a-z0-9&+\-\s.]/g, " ").replace(/\s+/g, " ") + " ";
    const c = { raw: q, industries: [], country: null, region: null, city: null, sizeMin: null, sizeMax: null,
      tech: [], signals: [], titles: [], seniority: [], departments: [], keywords: [], funded: false };

    for (const [ind, words] of Object.entries(INDUSTRY_WORDS))
      if (words.some((w) => t.includes(" " + w + " ") || t.includes(" " + w + "s "))) c.industries.push(ind);

    for (const [w, r] of Object.entries(REGION_WORDS)) if (t.includes(" " + w + " ")) c.region = r;
    for (const [w, cn] of Object.entries(COUNTRY_ALIASES)) if (t.includes(" " + w + " ")) { c.country = cn; break; }
    D.vocab.GEO.forEach((g) => g.cities.forEach((city) => { if (t.includes(" " + city.toLowerCase() + " ")) { c.city = city; c.country = g.country; } }));

    TECH_WORDS.forEach((w) => { if (t.includes(" " + w)) c.tech.push(w); });
    SIGNAL_PATTERNS.forEach((s) => { if (s.re.test(q)) c.signals.push(s.signal); });
    if (/\bfunded\b|\braised\b|\bfunding\b/.test(t)) c.funded = true;

    // size: "25-200", "under 50", "over 100", "50+", "between 10 and 90"
    let m;
    if ((m = t.match(/(\d+)\s*(?:-|–|to|and)\s*(\d+)/))) { c.sizeMin = +m[1]; c.sizeMax = +m[2]; }
    if ((m = t.match(/(?:under|below|less than|fewer than|up to)\s*(\d+)/))) c.sizeMax = +m[1];
    if ((m = t.match(/(?:over|above|more than|at least)\s*(\d+)/))) c.sizeMin = +m[1];
    if ((m = t.match(/(\d+)\s*\+/))) c.sizeMin = +m[1];
    if (/\bstartups?\b|\bearly[- ]stage\b|\bsmall\b/.test(t) && c.sizeMax == null && c.sizeMin == null) c.sizeMax = 60;
    if (/\benterprise\b|\blarge\b/.test(t) && c.sizeMin == null) c.sizeMin = 400;

    for (const [w, s] of Object.entries(SENIORITY_WORDS)) if (t.includes(" " + w)) if (!c.seniority.includes(s)) c.seniority.push(s);
    for (const [w, d] of Object.entries(DEPT_WORDS)) if (t.includes(" " + w)) if (!c.departments.includes(d)) c.departments.push(d);
    ["ceo","cto","cfo","ciso","chro","dean","registrar","principal","provost","partner","founder","director of teaching & learning","head of l&d","vp academic"]
      .forEach((w) => { if (t.includes(" " + w)) c.titles.push(w); });

    c.keywords = t.split(" ").filter((w) => w.length > 2 && !STOP.has(w) && isNaN(+w));
    return c;
  }

  // ===================================================== MATCHING
  function companyMatches(co, c) {
    if (c.industries.length && !c.industries.includes(co.industry)) return false;
    if (c.country && co.country !== c.country) return false;
    if (c.region && co.region !== c.region) return false;
    if (c.city && co.city !== c.city) return false;
    if (c.sizeMin != null && co.size < c.sizeMin) return false;
    if (c.sizeMax != null && co.size > c.sizeMax) return false;
    if (c.funded && !co.funding) return false;
    if (c.tech.length && !c.tech.some((tw) => co.tech.some((ct) => ct.toLowerCase().includes(tw)))) return false;
    if (c.signals.length && !c.signals.some((s) => co.signals.includes(s))) return false;
    return true;
  }

  function searchCompanies(query, opts) {
    opts = opts || {};
    const c = typeof query === "string" ? parseQuery(query) : query;
    const icp = opts.icp || null;
    const out = [];
    D.companies.forEach((co) => {
      if (!companyMatches(co, c)) return;
      const sc = scoreCompany(co, c, icp);
      out.push(Object.assign({}, co, { _score: sc.total, _breakdown: sc, _reason: fitReason(co, c, icp) }));
    });
    out.sort((a, b) => b._score - a._score);
    return { criteria: c, results: out };
  }

  function searchPeople(query, opts) {
    opts = opts || {};
    const c = typeof query === "string" ? parseQuery(query) : query;
    const out = [];
    D.people.forEach((p) => {
      const co = companyById(p.companyId);
      if (!companyMatches(co, c)) return;
      if (c.seniority.length && !c.seniority.includes(p.seniority)) return;
      if (c.departments.length && !c.departments.includes(p.department)) return;
      if (c.titles.length && !c.titles.some((tw) => p.title.toLowerCase().includes(tw))) return;
      const sc = scoreCompany(co, c, opts.icp || null);
      const bonus = (p.seniority === "C-Suite" ? 8 : p.seniority === "VP" ? 5 : p.seniority === "Head" ? 3 : 0) + (p.verified ? 5 : 0);
      out.push(Object.assign({}, p, { company: co, _score: Math.min(99, sc.total + bonus), _breakdown: sc,
        _reason: `${p.title} at a ${co.size}-person ${co.industry.toLowerCase()} organization in ${co.city}. ${p.verified ? "Email verified." : "Email needs verification."}` }));
    });
    out.sort((a, b) => b._score - a._score);
    return { criteria: c, results: out };
  }

  // ===================================================== LEAD SCORING (spec §U)
  // Deterministic sub-scores that add to an explainable 0-100 overall score.
  function scoreCompany(co, c, icp) {
    // 1. Company fit (0-30)
    let companyFit = 12;
    if (c && c.industries.length && c.industries.includes(co.industry)) companyFit += 10;
    if (icp) {
      if (icp.industry === co.industry) companyFit += 12;
      if (icp.country && icp.country === co.country) companyFit += 4;
      if (icp.sizeMin && co.size >= icp.sizeMin) companyFit += 4;
    }
    companyFit = Math.min(30, companyFit);

    // 2. Buyer fit (0-20) — do the right roles exist here?
    const staff = D.peopleByCompany[co.id] || [];
    const senior = staff.filter((p) => p.seniority === "C-Suite" || p.seniority === "VP" || p.seniority === "Head").length;
    const buyerFit = Math.min(20, 6 + senior * 5);

    // 3. Intent signal (0-20)
    const intent = Math.min(20, co.signals.length * 7 + (co.funding ? 4 : 0));

    // 4. Timing (0-10)
    let timing = 3;
    if (co.funding && +co.funding.date >= 2025) timing += 4;
    if (co.signals.some((s) => /Hiring|New executive|Expanding/.test(s))) timing += 4;
    timing = Math.min(10, timing);

    // 5. Data confidence (0-10)
    const verified = staff.filter((p) => p.verified).length;
    const dataConfidence = Math.min(10, 2 + verified * 3);

    // 6. Personalization strength (0-10) — how much do we have to write about?
    const personalization = Math.min(10, 2 + co.signals.length * 2 + co.tech.length + (co.funding ? 2 : 0));

    const total = Math.max(38, Math.min(99, companyFit + buyerFit + intent + timing + dataConfidence + personalization));
    return { companyFit, buyerFit, intent, timing, dataConfidence, personalization, total,
      band: total >= 85 ? "HIGH PRIORITY" : total >= 70 ? "STRONG" : total >= 55 ? "MODERATE" : "LOW" };
  }

  function fitReason(co, c, icp) {
    const bits = [];
    if (icp && icp.industry === co.industry) bits.push(`matches your "${icp.name}" ICP`);
    else if (c && c.industries.includes(co.industry)) bits.push(`${co.industry} match`);
    if (co.signals.length) bits.push(co.signals[0].toLowerCase());
    if (co.funding) bits.push(`${co.funding.round} ${co.funding.amount} (${co.funding.date})`);
    const staff = D.peopleByCompany[co.id] || [];
    if (staff.length) bits.push(`${staff.length} reachable decision-maker${staff.length === 1 ? "" : "s"}`);
    return bits.length ? bits.join(" · ") : `${co.size}-person ${co.industry.toLowerCase()} organization in ${co.city}`;
  }

  // ===================================================== DEEP RESEARCH (spec §D)
  function deepResearch(co, person) {
    const staff = D.peopleByCompany[co.id] || [];
    const dm = person || staff[0];
    const pains = co.pains || [];
    return {
      companyId: co.id, generatedAt: Date.now(),
      overview: `${co.name} is a ${co.size}-person ${co.sub.toLowerCase()} organization in the ${co.industry.toLowerCase()} sector, headquartered in ${co.city}, ${co.country}. ${co.desc} Founded ${co.founded}; estimated revenue ${co.revenue}.`,
      buyingSignals: co.signals.length ? co.signals.map((s) => ({ signal: s, weight: /Hiring|funded|executive/i.test(s) ? "Strong" : "Moderate" }))
        : [{ signal: "No public trigger detected in the last 90 days", weight: "Weak" }],
      painPoints: pains.slice(0, 3),
      productFit: `Their ${co.industry.toLowerCase()} profile maps to the ${co.size > 200 ? "institution-wide readiness audit" : "focused training cohort"} offer. ${co.tech.length ? "Existing stack (" + co.tech.join(", ") + ") means integration friction is low." : ""}`,
      whyNow: co.funding && +co.funding.date >= 2025 ? `Fresh ${co.funding.round} capital (${co.funding.amount}, ${co.funding.date}) usually unlocks discretionary program budget within two quarters.`
        : co.signals.some((s) => /Hiring/.test(s)) ? "Active hiring signals a growth mandate with budget attached; new leaders buy in their first 90 days."
        : co.signals.some((s) => /AI policy/.test(s)) ? "They have published an AI position publicly, which means the mandate exists and implementation is the open gap."
        : "No urgent trigger. Treat as a nurture-tier account rather than a priority send.",
      competitors: pickCompetitors(co),
      initiatives: co.signals.length ? co.signals.map((s) => `Public signal: ${s}`) : ["No public initiatives detected"],
      technologies: co.tech,
      decisionMaker: dm ? { name: dm.name, title: dm.title, seniority: dm.seniority, email: dm.email, status: dm.emailStatus } : null,
      angles: buildAngles(co, dm),
      recommendation: co.signals.length >= 2 ? "Send now. Lead with the strongest trigger in the first line."
        : co.signals.length === 1 ? "Send this week. Anchor on the single trigger and keep the ask small."
        : "Hold for nurture. Not enough context for a credible personalized opener.",
      sources: [`${co.domain} (site analysis)`, "Public job postings", "Funding & press records", "Technology fingerprint"],
    };
  }
  function pickCompetitors(co) {
    return D.companies.filter((x) => x.id !== co.id && x.industry === co.industry && Math.abs(x.size - co.size) < co.size * 0.9)
      .slice(0, 3).map((x) => x.name);
  }
  function buildAngles(co, dm) {
    const a = [];
    if (co.signals.includes("Hiring sales leaders")) a.push("They are hiring revenue leaders — new leaders need their team ramped fast.");
    if (co.signals.includes("Published AI policy")) a.push("They published an AI policy — implementation support is the obvious next gap.");
    if (co.funding) a.push(`Recent ${co.funding.round} means budget cycles are open.`);
    if (co.tech.length) a.push(`They run ${co.tech[0]} — reference an integration-friendly rollout.`);
    if (dm && dm.seniority === "C-Suite") a.push("Executive contact: lead with business outcome, not curriculum detail.");
    if (!a.length) a.push(`Anchor on the sector-wide pressure: ${(co.pains || ["AI readiness"])[0]}.`);
    return a;
  }

  // ===================================================== LOOKALIKES (spec §E)
  function lookalikes(co, limit) {
    const fp = { industry: co.industry, sub: co.sub, size: co.size, country: co.country, tech: new Set(co.tech.map((t) => t.toLowerCase())) };
    return D.companies.filter((x) => x.id !== co.id).map((x) => {
      let s = 0; const why = [];
      if (x.industry === fp.industry) { s += 34; why.push("same industry"); }
      if (x.sub === fp.sub) { s += 14; why.push("same segment"); }
      if (x.country === fp.country) { s += 10; why.push("same market"); }
      const techOverlap = x.tech.filter((t) => fp.tech.has(t.toLowerCase())).length;
      if (techOverlap) { s += techOverlap * 7; why.push(`${techOverlap} shared technolog${techOverlap === 1 ? "y" : "ies"}`); }
      const sizeCloseness = 1 - Math.min(1, Math.abs(x.size - fp.size) / Math.max(120, fp.size * 2));
      s += sizeCloseness * 16;
      if (sizeCloseness > 0.75) why.push("similar headcount");
      if (x.signals.length) s += 4;
      return Object.assign({}, x, { _score: Math.min(99, Math.round(40 + s)), _reason: why.join(" · ") || "loose profile similarity" });
    }).filter((x) => x._score >= 58).sort((a, b) => b._score - a._score).slice(0, limit || 25);
  }

  // ===================================================== SEGMENTS (spec §F)
  function segments(criteriaFilter) {
    const map = {};
    D.companies.forEach((co) => {
      const key = co.industry;
      const m = map[key] || (map[key] = { name: key, companies: 0, people: 0, verified: 0, signalRich: 0, sizes: [], countries: {} });
      m.companies++;
      const staff = D.peopleByCompany[co.id] || [];
      m.people += staff.length;
      m.verified += staff.filter((p) => p.verified).length;
      if (co.signals.length) m.signalRich++;
      m.sizes.push(co.size);
      m.countries[co.country] = (m.countries[co.country] || 0) + 1;
    });
    return Object.values(map).map((m) => {
      const icp = D.icps.find((i) => i.industry === m.name);
      m.avgSize = Math.round(m.sizes.reduce((a, b) => a + b, 0) / m.sizes.length);
      m.topCountry = Object.entries(m.countries).sort((a, b) => b[1] - a[1])[0][0];
      m.coverage = Math.round((m.verified / Math.max(1, m.people)) * 100);
      m.signalRate = Math.round((m.signalRich / m.companies) * 100);
      m.fit = icp ? icp.fit : Math.max(35, Math.min(80, 40 + m.signalRate / 2 + m.coverage / 4));
      m.icp = icp || null;
      return m;
    }).sort((a, b) => b.fit - a.fit);
  }

  // ===================================================== EMAIL GENERATION (spec §H)
  const TONES = {
    direct: { greet: (f) => `Hi ${f},`, close: "Worth a 15-minute call?", sign: "— Andre" },
    consultative: { greet: (f) => `Hi ${f},`, close: "If it's useful I can share how two comparable institutions approached it.", sign: "— Andre" },
    warm: { greet: (f) => `Hi ${f},`, close: "Happy to send over a short outline if that's helpful.", sign: "— Andre" },
    executive: { greet: (f) => `${f},`, close: "Open to a brief call to see whether it maps to your plan?", sign: "— Andre" },
  };

  function generateEmail(co, person, opts) {
    opts = opts || {};
    const tone = TONES[opts.tone || "consultative"];
    const first = person.name.split(" ")[0];
    const research = deepResearch(co, person);
    const trigger = co.signals[0];
    const pain = (co.pains || ["AI readiness"])[0];
    const goal = opts.goal || "book a short call";

    const opener = trigger
      ? `Saw ${co.name} ${trigger.toLowerCase()} — that usually means the AI question moves from "should we" to "how, and who owns it."`
      : `I work with ${co.industry.toLowerCase()} teams around your size on ${pain}.`;

    const middle = co.industry === "Higher Education"
      ? `Most institutions I work with have a policy statement but no faculty adoption path behind it. The gap shows up as inconsistent assessment rules and staff who quietly avoid the tools.`
      : co.industry === "EdTech"
      ? `The teams selling into institutions right now are losing cycles to procurement, not to competitors. Governance language in the deck is usually what unlocks it.`
      : `The pattern I keep seeing: leadership has an AI mandate, and the team underneath it has no shared standard for what "good" looks like.`;

    const proof = `I run readiness audits and faculty/staff training cohorts that produce something defensible to a board, not a slide deck.`;

    const subject = trigger
      ? `${co.name} + ${trigger.toLowerCase()}`
      : `${pain} at ${co.name}`;

    const body = [tone.greet(first), "", opener, "", middle, "", proof, "", tone.close, tone.sign].join("\n");

    return { subject, body, tone: opts.tone || "consultative", goal,
      personalization: research.angles.slice(0, 2),
      strength: trigger ? "High — anchored on a live trigger" : "Medium — sector-level personalization only" };
  }

  function followUp(co, person, step) {
    const first = person.name.split(" ")[0];
    const bodies = [
      `Hi ${first},\n\nBumping this once in case it slipped. The short version: I help ${co.industry.toLowerCase()} teams turn an AI mandate into something staff actually use.\n\nWorth 15 minutes?\n\n— Andre`,
      `Hi ${first},\n\nLast note from me. If the timing is wrong I'll close the loop.\n\nIf it's useful later, the readiness audit is the usual starting point — it produces a board-ready picture in about three weeks.\n\n— Andre`,
    ];
    return { subject: `Re: ${co.name}`, body: bodies[Math.min(step - 1, bodies.length - 1)] };
  }

  // ===================================================== REPLY INTENT (spec §8)
  const INTENTS = [
    { key: "Meeting Request", hot: true, color: "good", re: /\b(calendar|book|schedule|available|what times?|let'?s (?:talk|meet|chat)|send an invite|next week works)\b/i },
    { key: "Interested", hot: true, color: "good", re: /\b(interested|tell me more|sounds good|keen|would like to (?:hear|learn)|send (?:more|over))\b/i },
    { key: "Pricing", hot: true, color: "good", re: /\b(pricing|price|cost|how much|budget|rates?|quote|proposal)\b/i },
    { key: "Question", hot: false, color: "warn", re: /\b(how does|what does|can you|do you|question|clarify|curious (?:about|how))\b/i },
    { key: "Referral", hot: false, color: "warn", re: /\b(right person|colleague|introduce|forward(?:ed|ing)? (?:this|you)|reach out to|speak (?:with|to) [A-Z])\b/i },
    { key: "Not Now", hot: false, color: "warn", re: /\b(next (?:quarter|year|semester)|revisit|circle back|not (?:right )?now|later this year|after (?:the )?budget)\b/i },
    { key: "Objection", hot: false, color: "warn", re: /\b(already (?:have|working)|we use|in-house|not a (?:fit|priority)|too expensive|no budget)\b/i },
    { key: "Out of Office", hot: false, color: "muted", re: /\b(out of (?:the )?office|on leave|annual leave|vacation|away until|parental leave)\b/i },
    { key: "Wrong Person", hot: false, color: "muted", re: /\b(not (?:the right|who|my)|wrong person|don'?t handle|no longer with|left the (?:company|organization))\b/i },
    { key: "Unsubscribe", hot: false, color: "bad", re: /\b(unsubscribe|remove me|stop (?:emailing|contacting)|take me off|opt out|do not contact)\b/i },
    { key: "Negative", hot: false, color: "bad", re: /\b(not interested|no thanks|no thank you|pass\b|spam|stop)\b/i },
  ];

  function classifyReply(text) {
    const t = String(text || "");
    // Order matters: hard negatives and compliance intents win over soft positives.
    const compliance = INTENTS.filter((i) => i.color === "bad");
    for (const i of compliance) if (i.re.test(t)) return verdict(i, t);
    for (const i of INTENTS) if (i.re.test(t)) return verdict(i, t);
    return { intent: "Neutral", hot: false, color: "muted", confidence: 42,
      rationale: "No clear intent language detected. Routed for human review.", action: "Review manually" };
  }
  function verdict(i, t) {
    const hits = (t.match(i.re) || []).length;
    return {
      intent: i.key, hot: i.hot, color: i.color,
      confidence: Math.min(97, 68 + hits * 12 + Math.min(12, Math.floor(t.length / 40))),
      rationale: `Matched ${i.key.toLowerCase()} language in the reply body.`,
      action: i.key === "Meeting Request" ? "Propose times and create the meeting"
        : i.key === "Pricing" ? "Send scoped pricing, then propose a call"
        : i.key === "Interested" ? "Reply with a concrete next step"
        : i.key === "Referral" ? "Thank them and open a thread with the named person"
        : i.key === "Unsubscribe" ? "Suppress permanently — no further contact"
        : i.key === "Negative" ? "Suppress this contact and stop the sequence"
        : i.key === "Out of Office" ? "Snooze until the return date"
        : i.key === "Wrong Person" ? "Ask for the correct owner, suppress this contact"
        : i.key === "Not Now" ? "Schedule a nurture follow-up"
        : i.key === "Objection" ? "Human reply — address the objection directly"
        : "Answer the question, then propose a call",
      autoReplySafe: i.key === "Meeting Request" || i.key === "Interested" || i.key === "Out of Office",
    };
  }

  // ===================================================== ANALYTICS (spec §14)
  function analytics(ws) {
    const camps = ws.campaigns || [];
    const sum = (f) => camps.reduce((a, c) => a + (c[f] || 0), 0);
    const sent = sum("sent"), replies = sum("replies"), positive = sum("positive"),
      hot = sum("hot"), meetings = sum("meetings"), spend = sum("spend");
    const byCampaign = camps.map((c) => ({ name: c.name, leads: (c.leadIds || []).length, sent: c.sent, replies: c.replies, hot: c.hot, meetings: c.meetings, spend: c.spend,
      replyRate: c.sent ? +(c.replies / c.sent * 100).toFixed(1) : 0 }));
    const segs = segments();
    const best = byCampaign.slice().sort((a, b) => b.replyRate - a.replyRate)[0];
    const worst = byCampaign.filter((c) => c.sent > 0).sort((a, b) => a.replyRate - b.replyRate)[0];
    const insights = [];
    if (best && worst && best !== worst && worst.replyRate > 0) {
      const mult = (best.replyRate / Math.max(0.1, worst.replyRate)).toFixed(1);
      insights.push(`"${best.name}" is converting ${mult}x better than "${worst.name}". Shift volume toward it.`);
    }
    if (best) insights.push(`Best-performing ICP: ${best.name} at a ${best.replyRate}% reply rate.`);
    const verifiedShare = Math.round(D.people.filter((p) => p.verified).length / D.people.length * 100);
    insights.push(`${verifiedShare}% of contacts in your reachable set have verified email. Unverified sends are the largest bounce risk.`);
    if (meetings) insights.push(`Cost per meeting is $${(spend / meetings).toFixed(2)} across ${meetings} booked.`);
    return {
      sent, replies, positive, hot, meetings, spend,
      replyRate: sent ? +(replies / sent * 100).toFixed(1) : 0,
      positiveRate: replies ? +(positive / replies * 100).toFixed(1) : 0,
      costPerLead: replies ? +(spend / replies).toFixed(2) : 0,
      costPerMeeting: meetings ? +(spend / meetings).toFixed(2) : 0,
      byCampaign, segments: segs.slice(0, 6), insights,
    };
  }

  // ===================================================== HELPERS
  const _coIdx = {}; D.companies.forEach((c) => (_coIdx[c.id] = c));
  const _peIdx = {}; D.people.forEach((p) => (_peIdx[p.id] = p));
  function companyById(id) { return _coIdx[id]; }
  function personById(id) { return _peIdx[id]; }

  return { parseQuery, searchCompanies, searchPeople, scoreCompany, deepResearch, lookalikes,
    segments, generateEmail, followUp, classifyReply, analytics, companyById, personById, TONES, INTENTS };
})();

<script>
/* Dr. D Lead Engineering System — workspace seed.
 * Builds the "running sales department" demo state: campaigns, conversations,
 * replies, hot leads, meetings, suppression, usage and the agent activity feed.
 * Persisted to localStorage; DRD_WORKSPACE.reset() rebuilds from seed.
 */
window.DRD_WORKSPACE = (function () {
  "use strict";
  const D = window.DRD_DATA, E = window.DRD_ENGINE;
  const KEY = "drd_workspace_v1";
  const DAY = 86400000;

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // Original reply bodies keyed by the intent they should classify as.
  const REPLY_BANK = [
    { t: "Thanks for reaching out. This is timely — our board asked for an AI plan last month and we have nothing formal. What does the audit actually involve?" },
    { t: "Interested. Can you send pricing for a faculty cohort of about 40 people?" },
    { t: "I'm not the right person for this. Reach out to our Director of Teaching and Learning, she owns this file." },
    { t: "Let's talk. I have Tuesday or Thursday afternoon open next week — what works on your end?" },
    { t: "We already have an internal working group on this. Not a priority for us right now." },
    { t: "Out of the office until the 14th with limited access to email. I'll respond when I'm back." },
    { t: "How does this differ from the generic AI training vendors that have been emailing us all year?" },
    { t: "Please remove me from your list and do not contact me again." },
    { t: "Not interested, thanks." },
    { t: "Circle back next quarter — our budget cycle restarts in April and I'd rather talk with real numbers." },
    { t: "This looks useful. What would a three-week engagement cost for a department of our size?" },
    { t: "Can you clarify whether this covers assessment policy or just tool training? That distinction matters for us." },
    { t: "Happy to book something. Send an invite for any morning that week." },
    { t: "We're mid-procurement on something similar. Worth a conversation anyway — what's your availability?" },
    { t: "Forwarding this to our AVP Innovation, he's leading the initiative." },
  ];

  function build() {
    const rnd = mulberry32(777001);
    const pick = (a) => a[Math.floor(rnd() * a.length)];
    const now = Date.now();

    // ---- pick target companies per ICP -------------------------------
    const approved = D.icps.filter((i) => i.approved);
    const campaignDefs = [
      { name: "Ontario Colleges — Readiness Audit", icp: "icp_1", goal: "Book a 20-minute readiness call", tone: "consultative", status: "Active", budget: 900, autopilot: true },
      { name: "EdTech Partnerships — Q3", icp: "icp_2", goal: "Book a partnership intro", tone: "direct", status: "Active", budget: 600, autopilot: true },
      { name: "Enterprise L&D — AI Upskilling", icp: "icp_3", goal: "Book a scoping call", tone: "executive", status: "Active", budget: 750, autopilot: false },
      { name: "US Universities — Pilot Expansion", icp: "icp_1", goal: "Book a pilot conversation", tone: "consultative", status: "Paused", budget: 400, autopilot: false },
      { name: "Professional Services — Warm Test", icp: "icp_4", goal: "Gauge interest in partner training", tone: "warm", status: "Draft", budget: 250, autopilot: false },
    ];

    const campaigns = [], conversations = [], meetings = [], activity = [];
    let convId = 1, meetId = 1;

    campaignDefs.forEach((def, ci) => {
      const icp = D.icps.find((i) => i.id === def.icp);
      const pool = D.companies.filter((c) => c.industry === icp.industry && (!icp.country || c.country === icp.country) && (!icp.sizeMin || c.size >= icp.sizeMin));
      const chosen = pool.slice(0, def.status === "Draft" ? 14 : def.status === "Paused" ? 18 : 26);
      const leadIds = [];
      chosen.forEach((co) => { (D.peopleByCompany[co.id] || []).slice(0, 2).forEach((p) => leadIds.push(p.id)); });

      const isLive = def.status !== "Draft";
      const sent = isLive ? Math.floor(leadIds.length * (def.status === "Active" ? 1.75 : 0.9)) : 0;
      const replies = isLive ? Math.max(2, Math.round(sent * (0.07 + rnd() * 0.09))) : 0;
      const positive = Math.max(1, Math.round(replies * (0.32 + rnd() * 0.25)));

      const camp = {
        id: "cmp_" + (ci + 1), name: def.name, icpId: def.icp, goal: def.goal, tone: def.tone,
        status: def.status, autopilot: def.autopilot, budget: def.budget,
        spend: isLive ? +(sent * 0.031).toFixed(2) : 0,
        leadIds, sent, replies, positive, hot: 0, meetings: 0,
        createdAt: now - (30 - ci * 4) * DAY,
        sequence: [
          { step: 1, day: 0, label: "Personalized opener" },
          { step: 2, day: 3, label: "Follow-up — short bump" },
          { step: 3, day: 8, label: "Final note — close the loop" },
        ],
      };

      // ---- conversations for the replies -----------------------------
      const repliers = leadIds.slice(0, replies);
      repliers.forEach((pid, i) => {
        const p = E.personById(pid); if (!p) return;
        const co = E.companyById(p.companyId);
        const bank = REPLY_BANK[(ci * 5 + i) % REPLY_BANK.length];
        const cls = E.classifyReply(bank.t);
        const outbound = E.generateEmail(co, p, { tone: def.tone, goal: def.goal });
        const at = now - int(rnd, 1, 21) * DAY;
        const conv = {
          id: "cnv_" + convId++, personId: pid, companyId: co.id, campaignId: camp.id,
          subject: outbound.subject,
          messages: [
            { dir: "out", text: outbound.body, at: at - 2 * DAY },
            { dir: "in", text: bank.t, at },
          ],
          intent: cls.intent, intentMeta: cls, hot: cls.hot,
          status: cls.hot ? "Need Reply" : (cls.intent === "Unsubscribe" || cls.intent === "Negative" ? "Closed" : "Need Reply"),
          starred: false, at,
        };
        if (cls.hot) camp.hot++;
        conversations.push(conv);

        // ---- meetings from meeting-intent replies --------------------
        if (cls.intent === "Meeting Request" || (cls.intent === "Interested" && rnd() > 0.55)) {
          meetings.push({
            id: "mtg_" + meetId++, personId: pid, companyId: co.id, campaignId: camp.id,
            at: now + int(rnd, -6, 16) * DAY,
            duration: 30,
            status: rnd() > 0.75 ? "Completed" : "Confirmed",
            title: `${co.name} — AI readiness intro`,
          });
          camp.meetings++;
        }
      });
      campaigns.push(camp);
    });

    // Book meetings only where the reply actually justifies one. Roughly a third of
    // hot leads stay unbooked on purpose — that is the work the inbox exists to do.
    conversations.filter((c) => c.hot).forEach((c) => {
      if (meetings.some((m) => m.personId === c.personId)) return;
      if (rnd() > 0.62) return;
      meetings.push({ id: "mtg_" + meetId++, personId: c.personId, companyId: c.companyId, campaignId: c.campaignId,
        at: now + int(rnd, -4, 18) * DAY, duration: 30,
        status: pick(["Confirmed", "Confirmed", "Proposed"]),
        title: `${E.companyById(c.companyId).name} — AI readiness intro` });
      const camp = campaigns.find((x) => x.id === c.campaignId);
      if (camp) camp.meetings++;
    });

    // Historical pipeline: completed meetings from earlier outreach on accounts that
    // are not part of the current live threads, so analytics has real history.
    const contacted = new Set(conversations.map((c) => c.personId));
    for (const camp of campaigns) {
      for (const lid of camp.leadIds) {
        if (meetings.length >= 20) break;
        if (contacted.has(lid) || meetings.some((m) => m.personId === lid)) continue;
        if (rnd() > 0.25) continue;
        const p = E.personById(lid); if (!p) continue;
        meetings.push({ id: "mtg_" + meetId++, personId: lid, companyId: p.companyId, campaignId: camp.id,
          at: now - int(rnd, 3, 45) * DAY, duration: 30, status: "Completed",
          title: `${E.companyById(p.companyId).name} — AI readiness intro` });
        camp.meetings++;
      }
    }

    // ---- suppression -------------------------------------------------
    const suppressions = [];
    conversations.filter((c) => c.intent === "Unsubscribe" || c.intent === "Negative").forEach((c) => {
      const p = E.personById(c.personId);
      suppressions.push({ id: "sup_" + (suppressions.length + 1), type: "Person", value: p.email,
        reason: c.intent === "Unsubscribe" ? "Unsubscribe request" : "Explicit negative reply",
        scope: "Global", at: c.at });
    });
    suppressions.push({ id: "sup_x1", type: "Domain", value: "competitorgroup.com", reason: "Competitor — do not contact", scope: "Global", at: Date.now() - 40 * DAY });

    // ---- agent activity feed ----------------------------------------
    const feed = [
      { state: "OPTIMIZING", text: "Shifted 120 sends from “US Universities” to “Ontario Colleges” — 2.4x better reply rate.", at: now - 40 * 60000 },
      { state: "BOOKING", text: "Proposed three times to a hot lead at a Higher Education account.", at: now - 3 * 3600000 },
      { state: "QUALIFYING", text: "Classified 6 new replies. 2 hot, 1 referral, 1 unsubscribe suppressed.", at: now - 5 * 3600000 },
      { state: "SENDING", text: "Sent 84 personalized openers across 2 active campaigns.", at: now - 9 * 3600000 },
      { state: "WRITING", text: "Generated 84 emails anchored on live company triggers.", at: now - 11 * 3600000 },
      { state: "RESEARCHING", text: "Completed deep research on 31 priority accounts.", at: now - 26 * 3600000 },
      { state: "FINDING LEADS", text: "Added 52 companies and 118 decision-makers matching approved ICPs.", at: now - 30 * 3600000 },
      { state: "ANALYZING", text: "Refreshed ICP fit scores from the last 30 days of reply data.", at: now - 48 * 3600000 },
    ];

    return {
      version: 1,
      profile: D.businessProfile,
      icps: JSON.parse(JSON.stringify(D.icps)),
      campaigns, conversations, meetings, suppressions,
      activity: feed,
      savedSearches: [
        { id: "ss_1", name: "Ontario colleges 200+", query: "colleges in Ontario with more than 200 employees", kind: "companies" },
        { id: "ss_2", name: "EdTech heads of product", query: "heads of product at edtech companies", kind: "people" },
      ],
      lists: [],
      research: {},
      onboarded: true,
      autopilot: true,
      // Usage reflects the seeded activity: one credit per send, four per research report.
      credits: { plan: "Growth", included: 5000,
        used: campaigns.reduce((s, c) => s + c.sent, 0) + 31 * 4,
        emailRate: 0.031, researchRate: 0.12 },
      apiKeys: [{ id: "key_1", name: "Production", prefix: "drd_live_9f2c", created: Date.now() - 60 * DAY, lastUsed: Date.now() - 2 * DAY }],
      webhooks: [{ id: "wh_1", url: "https://edvisingu.app.n8n.cloud/webhook/drd-hot-lead", events: ["lead.hot", "meeting.booked"], active: true }],
      audit: [],
    };
  }
  function int(rnd, lo, hi) { return lo + Math.floor(rnd() * (hi - lo + 1)); }

  // ---- persistence ---------------------------------------------------
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const w = JSON.parse(raw); if (w && w.version === 1) return w; }
    } catch (e) {}
    const w = build();
    save(w);
    return w;
  }
  function save(w) { try { localStorage.setItem(KEY, JSON.stringify(w)); } catch (e) {} }
  function reset() { try { localStorage.removeItem(KEY); } catch (e) {} return load(); }

  return { load, save, reset, build };
})();

</script>
<script>
/* Dr. D Lead Engineering System — application layer.
 * Router, all module views, drawers, and persistence wiring.
 */
(function () {
  "use strict";
  const D = window.DRD_DATA, E = window.DRD_ENGINE, WS = window.DRD_WORKSPACE;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  let ws = WS.load();
  const state = {
    view: "overview",
    company: { query: "", results: null, criteria: null, sel: new Set(), sort: "score" },
    person: { query: "", results: null, criteria: null, sel: new Set() },
    inbox: { filter: "Need Reply", active: null },
    campaign: null,
    agentBusy: false,
  };

  // ---------------------------------------------------------------- utils
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  const money = (n) => "$" + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const num = (n) => Number(n || 0).toLocaleString();
  const initials = (n) => String(n).split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
  function ago(ts) {
    const d = Date.now() - ts, m = Math.round(d / 60000);
    if (m < 60) return m + "m ago";
    const h = Math.round(m / 60); if (h < 24) return h + "h ago";
    const dd = Math.round(h / 24); return dd + "d ago";
  }
  function dateStr(ts) { return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); }
  function timeStr(ts) { return new Date(ts).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
  function save() { WS.save(ws); }
  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.innerHTML = '<span class="d"></span>' + esc(msg);
    $("#toasts").appendChild(t);
    setTimeout(() => { t.style.opacity = "0"; t.style.transition = "0.3s"; setTimeout(() => t.remove(), 320); }, 2800);
  }
  function audit(action, detail) {
    ws.audit.unshift({ at: Date.now(), action, detail });
    ws.audit = ws.audit.slice(0, 200); save();
  }
  function scoreCls(n) { return n >= 82 ? "hi" : n >= 62 ? "mid" : "lo"; }

  // CSV export — uses the hosted downloads capability, falls back to a blob.
  async function exportCSV(filename, rows) {
    const csv = rows.map((r) => r.map((v) => {
      const s = String(v == null ? "" : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(",")).join("\n");
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
    if (dl) {
      try { await dl.save({ filename, data: csv }); toast("Exported " + (rows.length - 1) + " rows"); }
      catch (e) {
        if (e && e.code === "extension_not_enabled") {
          try { await dl.save({ filename: filename.replace(/\.csv$/, ".txt"), data: csv }); toast("Exported"); }
          catch (e2) { if (!e2 || e2.code !== "declined") toast("Export unavailable in this view"); }
        } else if (!e || e.code !== "declined") toast("Export unavailable in this view");
      }
      return;
    }
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 800);
    toast("Exported " + (rows.length - 1) + " rows");
  }

  // ---------------------------------------------------------------- nav
  const NAV = [
    { g: "Command" },
    { id: "overview", ic: "◆", t: "Overview" },
    { id: "agent", ic: "✦", t: "AI Agent" },
    { g: "Prospecting" },
    { id: "companies", ic: "▣", t: "Companies" },
    { id: "people", ic: "◉", t: "People" },
    { id: "segments", ic: "◈", t: "Segments" },
    { g: "Engagement" },
    { id: "campaigns", ic: "▶", t: "Campaigns" },
    { id: "inbox", ic: "✉", t: "Inbox", badge: () => ws.conversations.filter((c) => c.status === "Need Reply").length },
    { id: "hot", ic: "★", t: "Hot Leads", badge: () => ws.conversations.filter((c) => c.hot).length },
    { id: "meetings", ic: "◷", t: "Meetings" },
    { g: "Operations" },
    { id: "analytics", ic: "▤", t: "Analytics" },
    { id: "data", ic: "⛉", t: "Data & Compliance" },
    { id: "billing", ic: "◐", t: "Billing" },
    { id: "api", ic: "⟨⟩", t: "API" },
    { id: "settings", ic: "⚙", t: "Settings" },
  ];

  function renderNav() {
    $("#nav").innerHTML = NAV.map((n) => {
      if (n.g) return '<div class="group">' + esc(n.g) + "</div>";
      const b = n.badge ? n.badge() : 0;
      return '<button data-nav="' + n.id + '" class="' + (state.view === n.id ? "on" : "") + '">' +
        '<span class="ic">' + n.ic + "</span>" + esc(n.t) +
        (b ? '<span class="badge' + (n.id === "inbox" ? "" : "") + '">' + b + "</span>" : "") + "</button>";
    }).join("");
    $$("#nav button").forEach((b) => (b.onclick = () => go(b.dataset.nav)));

    const c = ws.credits;
    const pct = Math.min(100, Math.round((c.used / c.included) * 100));
    $("#sidefoot").innerHTML =
      '<div class="plan"><div class="row"><span>' + esc(c.plan) + " plan</span><b>" + pct + '%</b></div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="row"><span class="num">' + num(c.used) + " / " + num(c.included) + "</span><span>credits</span></div></div>";
  }

  function go(view) {
    state.view = view;
    renderNav();
    const t = NAV.find((n) => n.id === view);
    $("#ptitle").textContent = t ? t.t : view;
    const fn = VIEWS[view];
    $("#page").innerHTML = fn ? fn() : '<div class="empty">Not found</div>';
    if (WIRE[view]) WIRE[view]();
    window.scrollTo(0, 0);
  }

  // ================================================================ VIEWS
  const VIEWS = {};
  const WIRE = {};

  // ---------------------------------------------------------- OVERVIEW
  VIEWS.overview = function () {
    const a = E.analytics(ws);
    const hot = ws.conversations.filter((c) => c.hot).slice(0, 5);
    const upcoming = ws.meetings.filter((m) => m.at > Date.now()).sort((x, y) => x.at - y.at).slice(0, 4);
    const companiesFound = ws.campaigns.reduce((s, c) => s + new Set(c.leadIds.map((id) => (E.personById(id) || {}).companyId)).size, 0);

    return '<div class="page-head"><div>' +
      "<h2>Your AI sales department, at a glance</h2>" +
      "<p>What the agent did, who replied, who is hot, and what it is learning.</p>" +
      '</div><div class="head-actions">' +
      '<button class="btn ghost" data-act="run-agent">✦ Run agent cycle</button>' +
      '<button class="btn" data-nav2="campaigns">View campaigns</button></div></div>' +

      '<div class="stats">' +
      tile("Companies found", num(companiesFound), "across active ICPs") +
      tile("People contacted", num(a.sent), "personalized sends") +
      tile("Replies", num(a.replies), a.replyRate + "% reply rate") +
      tile("Hot leads", num(ws.conversations.filter((c) => c.hot).length), "meaningful interest", true) +
      tile("Meetings booked", num(ws.meetings.length), "confirmed + completed") +
      tile("Spend", money(a.spend), a.costPerMeeting ? money(a.costPerMeeting) + " / meeting" : "—") +
      "</div>" +

      '<div class="split">' +
        '<div class="stack">' +
          '<div class="card"><div class="card-h"><h3>What the agent is doing</h3>' +
            '<span class="grow"></span><span class="pill ' + (ws.autopilot ? "good" : "muted") + '">Autopilot ' + (ws.autopilot ? "ON" : "OFF") + "</span></div>" +
            '<div class="card-b"><div class="feed">' +
              ws.activity.slice(0, 7).map((f) =>
                '<div class="it"><div class="st">' + esc(f.state) + "</div>" +
                '<div><div class="tx">' + esc(f.text) + '</div><div class="tm">' + ago(f.at) + "</div></div></div>").join("") +
            "</div></div></div>" +

          '<div class="card"><div class="card-h"><h3>Campaign performance</h3></div><div class="card-b"><div class="bars">' +
            a.byCampaign.filter((c) => c.sent).map((c) => {
              const max = Math.max.apply(null, a.byCampaign.map((x) => x.replyRate).concat([1]));
              return '<div class="b"><div><div class="lbl">' + esc(c.name) + " · " + num(c.sent) + " sent</div>" +
                '<div class="track"><i style="width:' + Math.round((c.replyRate / max) * 100) + '%"></i></div></div>' +
                '<div class="val">' + c.replyRate + "%</div></div>";
            }).join("") +
          "</div></div></div>" +
        "</div>" +

        '<div class="stack">' +
          '<div class="card"><div class="card-h"><h3>What it is learning</h3></div><div class="card-b stack">' +
            a.insights.map((i) => '<div style="font-size:12.5px;color:var(--muted);display:flex;gap:9px"><span style="color:var(--gold)">▸</span><span>' + esc(i) + "</span></div>").join("") +
          "</div></div>" +

          '<div class="card"><div class="card-h"><h3>Hot leads</h3><span class="grow"></span>' +
            '<button class="btn ghost sm" data-nav2="hot">All</button></div><div class="card-b stack">' +
            (hot.length ? hot.map((c) => {
              const p = E.personById(c.personId), co = E.companyById(c.companyId);
              return '<div class="rowflex" style="justify-content:space-between;gap:8px">' +
                "<div><div style=\"font-size:13px;font-weight:600\">" + esc(p.name) + "</div>" +
                '<div style="font-size:11.5px;color:var(--faint)">' + esc(co.name) + "</div></div>" +
                '<span class="pill good">' + esc(c.intent) + "</span></div>";
            }).join("") : '<div style="color:var(--faint);font-size:12.5px">No hot leads yet.</div>') +
          "</div></div>" +

          '<div class="card"><div class="card-h"><h3>Upcoming meetings</h3></div><div class="card-b stack">' +
            (upcoming.length ? upcoming.map((m) => {
              const co = E.companyById(m.companyId), p = E.personById(m.personId);
              return '<div><div style="font-size:12.5px;font-weight:600">' + esc(co.name) + "</div>" +
                '<div style="font-size:11.5px;color:var(--faint)">' + esc(p.name) + " · " + timeStr(m.at) + "</div></div>";
            }).join("") : '<div style="color:var(--faint);font-size:12.5px">Nothing scheduled.</div>') +
          "</div></div>" +
        "</div>" +
      "</div>";
  };
  function tile(k, v, d, accent) {
    return '<div class="stat' + (accent ? " accent" : "") + '"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div><div class="d">' + esc(d) + "</div></div>";
  }
  WIRE.overview = function () {
    $$("[data-nav2]").forEach((b) => (b.onclick = () => go(b.dataset.nav2)));
    const r = $("[data-act='run-agent']"); if (r) r.onclick = runAgentCycle;
  };

  // Simulate one autonomous agent cycle: find → research → write → send.
  function runAgentCycle() {
    if (state.agentBusy) return;
    state.agentBusy = true;
    const steps = [
      ["ANALYZING", "Re-scored approved ICPs against the last 30 days of reply data."],
      ["FINDING LEADS", "Added " + (8 + Math.floor(Math.random() * 20)) + " companies matching your top ICP."],
      ["RESEARCHING", "Completed deep research on " + (4 + Math.floor(Math.random() * 9)) + " priority accounts."],
      ["WRITING", "Generated personalized openers anchored on live triggers."],
      ["SENDING", "Queued sends within your daily limit."],
    ];
    let i = 0;
    toast("Agent cycle started");
    const tick = () => {
      if (i >= steps.length) {
        state.agentBusy = false;
        audit("agent.cycle", "Completed one autonomous cycle");
        toast("Agent cycle complete");
        if (state.view === "overview" || state.view === "agent") go(state.view);
        return;
      }
      const s = steps[i++];
      ws.activity.unshift({ state: s[0], text: s[1], at: Date.now() });
      ws.activity = ws.activity.slice(0, 40);
      const cnt = ws.campaigns.filter((c) => c.status === "Active").length;
      if (s[0] === "SENDING" && cnt) {
        ws.campaigns.filter((c) => c.status === "Active").forEach((c) => { c.sent += 6; c.spend = +(c.spend + 6 * ws.credits.emailRate).toFixed(2); });
        ws.credits.used += 6 * cnt;
      }
      save();
      if (state.view === "overview" || state.view === "agent") { go(state.view); }
      setTimeout(tick, 620);
    };
    setTimeout(tick, 300);
  }

  // ------------------------------------------------------------- AGENT
  VIEWS.agent = function () {
    const p = ws.profile;
    return '<div class="page-head"><div><h2>AI Agent</h2>' +
      "<p>What the agent understands about your business, the markets it selected, and how much control it has.</p></div>" +
      '<div class="head-actions"><button class="btn ghost" data-act="reanalyze">↻ Re-analyze website</button>' +
      '<button class="btn" data-act="run-agent">✦ Run agent cycle</button></div></div>' +

      '<div class="card pad" style="margin-bottom:16px">' +
        '<div class="rowflex" style="justify-content:space-between">' +
          "<div><div class=\"label\">Autonomy</div>" +
          '<div style="font-size:14px;margin-top:4px">Autopilot lets the agent prioritize campaigns, allocate volume and adjust budgets on its own.</div></div>' +
          '<label class="toggle"><input type="checkbox" id="autopilot" ' + (ws.autopilot ? "checked" : "") + '><span class="tr"></span>' +
          "<span>" + (ws.autopilot ? "On" : "Off") + "</span></label>" +
        "</div>" +
      "</div>" +

      '<div class="split">' +
        '<div class="card"><div class="card-h"><h3>AI understanding of your business</h3>' +
          '<span class="grow"></span><span class="pill gold">Editable</span></div><div class="card-b">' +
          '<div class="kv" style="margin-bottom:18px">' +
            kv("Website", p.website) + kv("Company", p.company) +

  function critBar(c, n, kind) {
    const t = [];
    c.industries.forEach((i) => t.push(crit("industry", i)));
    if (c.country) t.push(crit("country", c.country));
    if (c.region) t.push(crit("region", c.region));
    if (c.city) t.push(crit("city", c.city));
    if (c.sizeMin != null && c.sizeMax != null) t.push(crit("size", c.sizeMin + "–" + c.sizeMax));
    else if (c.sizeMin != null) t.push(crit("size", "≥ " + c.sizeMin));
    else if (c.sizeMax != null) t.push(crit("size", "≤ " + c.sizeMax));
    c.tech.forEach((x) => t.push(crit("tech", x)));
    c.signals.forEach((x) => t.push(crit("signal", x)));
    c.seniority.forEach((x) => t.push(crit("seniority", x)));
    c.departments.forEach((x) => t.push(crit("dept", x)));
    if (c.funded) t.push(crit("funding", "raised"));
    return '<div class="criteria"><span class="label" style="margin-right:2px">AI parsed</span>' + (t.join("") || '<span class="chip">broad match</span>') +
      '<span class="grow"></span><span style="font-size:12.5px;color:var(--muted)"><b style="color:var(--white)">' + num(n) + "</b> " + kind + "</span></div>";
  }

  function draftReply(c, p, co) {
    const first = p.name.split(" ")[0];
    switch (c.intent) {
      case "Meeting Request": return "Hi " + first + ",\n\nGreat — I'll send an invite. Two options:\n\n• Tuesday 10:00–10:30\n• Thursday 14:00–14:30\n\nReply with whichever suits and I'll confirm. I'll come with a one-page outline of how the readiness audit runs at an institution your size.\n\n— Andre";
      case "Pricing": return "Hi " + first + ",\n\nHappy to give you real numbers rather than a range.\n\nFor a group of your size the readiness audit typically runs three weeks and produces a board-ready findings document plus a faculty adoption plan. Training cohorts are priced per participant with a floor.\n\nQuickest path is 15 minutes to scope it properly — do you have time this week?\n\n— Andre";
      case "Interested": return "Hi " + first + ",\n\nGlad it landed. The usual starting point is a short readiness audit: I look at your current policy position, where staff actually are, and what the gaps mean for assessment.\n\nOutput is a document you can take to a board, not a slide deck.\n\nWorth 15 minutes to see whether it fits?\n\n— Andre";
      case "Question": return "Hi " + first + ",\n\nFair question, and it's the right one to ask.\n\nThe work covers both: the policy position and the practical adoption path behind it. Most institutions have the first and not the second, which is where the inconsistency shows up.\n\nHappy to walk through how that's structured — 15 minutes?\n\n— Andre";
      case "Referral": return "Hi " + first + ",\n\nThank you — that's helpful. I'll reach out directly.\n\nIf it's easier, feel free to forward this thread along with any context you think matters.\n\nAppreciate the pointer.\n\n— Andre";
      case "Not Now": return "Hi " + first + ",\n\nCompletely understood, and thanks for the straight answer.\n\nI'll follow up when your budget cycle reopens. If anything shifts before then, my line is open.\n\n— Andre";
      case "Objection": return "Hi " + first + ",\n\nThat's reasonable — an internal working group is the right first move.\n\nWhere I usually add value is after that: turning the group's position into something faculty actually apply consistently. If the group stalls on adoption, that's the moment to talk.\n\nI'll leave it with you.\n\n— Andre";
      case "Out of Office": return "(Auto-snoozed — the agent will resume this thread after the return date. No reply sent.)";
      case "Wrong Person": return "Hi " + first + ",\n\nApologies for the misdirect, and thanks for flagging it.\n\nCould you point me to whoever owns this file? I'll take you off this thread either way.\n\n— Andre";
      case "Unsubscribe": case "Negative": return "(No reply will be sent. This contact is suppressed permanently.)";
      default: return "Hi " + first + ",\n\nThanks for coming back to me. Just so I use your time well — is this something you're actively looking at, or better parked for later?\n\n— Andre";
    }
  }
  WIRE.inbox = function () {
    $$("[data-fil]").forEach((b) => (b.onclick = () => { state.inbox.filter = b.dataset.fil; state.inbox.active = null; go("inbox"); }));
    $$("[data-th]").forEach((d) => (d.onclick = () => { state.inbox.active = d.dataset.th; go("inbox"); }));
    const oc = $("[data-open-co]"); if (oc) oc.onclick = () => openCompany(oc.dataset.openCo);
    const send = $("[data-send]");
    if (send) send.onclick = () => {
      const c = ws.conversations.find((x) => x.id === send.dataset.send);
      c.messages.push({ dir: "out", text: $("#replybox").value, at: Date.now() });
      c.status = "Replied"; save(); audit("inbox.reply", c.id);
      toast("Reply sent"); go("inbox");
    };
    const bk = $("[data-book]");
    if (bk) bk.onclick = () => {
      const c = ws.conversations.find((x) => x.id === bk.dataset.book);
      if (ws.meetings.some((m) => m.personId === c.personId)) { toast("Meeting already booked"); return; }
      const co = E.companyById(c.companyId);
      ws.meetings.push({ id: "mtg_" + Date.now().toString(36), personId: c.personId, companyId: c.companyId,
        campaignId: c.campaignId, at: Date.now() + 5 * 86400000, duration: 30, status: "Confirmed",
        title: co.name + " — AI readiness intro" });
      const camp = ws.campaigns.find((x) => x.id === c.campaignId); if (camp) camp.meetings++;
      c.status = "Replied"; save(); audit("meeting.booked", co.name);
      toast("Meeting booked"); go("inbox");
    };
    const rg = $("[data-regen]");
    if (rg) rg.onclick = () => { toast("Draft regenerated"); $("#replybox").value = draftReply(
      ws.conversations.find((x) => x.id === rg.dataset.regen),
      E.personById(ws.conversations.find((x) => x.id === rg.dataset.regen).personId),
      E.companyById(ws.conversations.find((x) => x.id === rg.dataset.regen).companyId)); };
    const sp = $("[data-supp]");
    if (sp) sp.onclick = () => {
      const c = ws.conversations.find((x) => x.id === sp.dataset.supp);
      const p = E.personById(c.personId);
      if (!ws.suppressions.some((s) => s.value === p.email)) {
        ws.suppressions.push({ id: "sup_" + Date.now().toString(36), type: "Person", value: p.email,
          reason: "Manually suppressed from inbox", scope: "Global", at: Date.now() });
      }
      c.status = "Closed"; c.hot = false; save(); audit("suppression.added", p.email);
      toast(p.email + " suppressed"); go("inbox");
    };
  };
