# Fly.io deployment for the Dr. D Lead Engineering System.
# app name is set on first `fly launch`; edit if you choose a different one.
app = "drd-lead-engine"
primary_region = "yyz"   # Toronto

[build]

[env]
  DRD_DB_PATH = "/data/drd.db"
  DRD_PUBLIC = "1"
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"

[[mounts]]
  source = "drd_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
